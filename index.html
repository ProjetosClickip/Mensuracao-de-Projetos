function nextFile(){
  imp.idx++;
  if (imp.idx < imp.queue.length) beginFile();
  else { imp.step='done'; renderWizard(); }
}
async function confirmImport(){
  const p = cur();
  const sel = imp.rows.filter(r=>r.sel);
  if (!sel.length) return toast('Nenhum item selecionado.','err');
  const bad = sel.filter(r=>rowErrors(r).length);
  if (bad.length){ imp.pvFilter='pend'; renderWizard(); toast(`${bad.length} item(ns) selecionado(s) com pendência (exibidos agora). Corrija ou desmarque antes de confirmar.`,'err',6000); return; }
  const ign = sel.filter(r=>r.dup && r.dupAction==='ignorar').length;
  const upd = sel.filter(r=>r.dup && r.dupAction==='atualizar').length;
  const nS = sel.filter(r=>r.categoria==='servico' && !(r.dup && r.dupAction==='ignorar')).length;
  const nM = sel.filter(r=>r.categoria!=='servico' && !(r.dup && r.dupAction==='ignorar')).length;
  const ok = await confirmDialog({title:'Confirmar importação', message:`<b>${esc(imp.file.name)}</b>${imp.sheet?' — aba '+esc(imp.sheet):''}<br><br>Materiais: <b>${nM}</b> · Serviços: <b>${nS}</b><br>Novos registros: <b>${sel.length-ign-upd}</b><br>Registros existentes atualizados: <b>${upd}</b><br>Duplicados ignorados: <b>${ign}</b><br>Não selecionados: <b>${imp.rows.length-sel.length}</b><br><br><span class="muted">Você poderá excluir esta importação depois pelo histórico.</span>`, okText:'Importar'});
  if (!ok) return;
  const origem = imp.file.name + (imp.sheet ? ' / '+imp.sheet : '');
  const histId = uid(); const itens = {materiais:[], servicos:[]}; const atualizados = [];
  let added=0, updated=0, valor=0;
  for (const r of sel){
    if (r.dup && r.dupAction==='ignorar') continue;
    if (r.categoria==='servico'){
      const prl = myPrest().find(x=>norm(x.nome)===norm(r.empresa));
      const d = {descricao:r.nome.trim(), empresa:prl?prl.nome:r.empresa.trim(), prestadoraId:prl?prl.id:null, unidade:r.unidade||'Serviço', quantidade:r.quantidade, valorUnitario:r.valorUnitario};
      valor += round2(d.quantidade*d.valorUnitario);
      if (r.dup && r.dupAction==='atualizar'){ const ex = p.servicos.find(s=>s.id===r.dup); if (ex){ atualizados.push({tipo:'servico', id:ex.id, antes:deepClone(ex)}); Object.assign(ex, d, {origem}); updated++; continue; } }
      const id = uid(); p.servicos.push(Object.assign({id, origem, importId:histId}, d)); itens.servicos.push(id); added++;
    } else {
      const d = {empresa:'', codigo:'', nome:r.nome.trim(), categoria:r.categoria==='ativacao'?'ativacao':'obra', unidade:r.unidade||'Unidade', quantidade:r.quantidade, valorUnitario:r.valorUnitario, valorTotal:round2(r.quantidade*r.valorUnitario)};
      valor += d.valorTotal;
      if (r.dup && r.dupAction==='atualizar'){ const ex = p.materiais.find(m=>m.id===r.dup); if (ex){ atualizados.push({tipo:'material', id:ex.id, antes:deepClone(ex)}); Object.assign(ex, d, {origem}); updated++; continue; } }
      const id = uid(); p.materiais.push(Object.assign({id, origem, importId:histId}, d)); itens.materiais.push(id); added++;
    }
  }
  const status = (added+updated)===imp.rows.length ? 'Concluída' : (added+updated)>0 ? 'Concluída (parcial)' : 'Concluída sem itens';
  const tipo = nM && nS ? 'misto' : nS ? 'servicos' : 'materiais';
  const det = [`${added} novo(s)`, updated?`${updated} atualizado(s)`:'', ign?`${ign} duplicado(s) ignorado(s)`:'', (imp.rows.length-sel.length)?`${imp.rows.length-sel.length} não selecionado(s)`:''].filter(Boolean).join(', ') + ' · ' + fmtBRL(valor);
  logImport(status, added+updated, det, {id:histId, itens, atualizados, tipo, valor:round2(valor)});
  toast(`${added+updated} item(ns) importado(s) de ${imp.file.name}${imp.sheet?' ('+imp.sheet+')':''}.`,'ok');
  nextFile();
}
/* Exclui do projeto os itens adicionados por uma importação e restaura os registros atualizados por ela */
function undoImport(id, silent, restore){
  const p = cur(); const h = p.importacoes.find(x=>x.id===id); if (!h) return {mats:0, svcs:0, rest:0};
  const it = histItems(p, h);
  const mIds = new Set(it.mats.map(m=>m.id)), sIds = new Set(it.svcs.map(s=>s.id));
  p.materiais = p.materiais.filter(m=>!mIds.has(m.id));
  p.servicos = p.servicos.filter(s=>!sIds.has(s.id));
  let rest = 0;
  if (restore!==false) (h.atualizados||[]).forEach(u=>{
    const list = u.tipo==='servico' ? p.servicos : p.materiais;
    const ex = list.find(x=>x.id===u.id);
    const antes = deepClone(u.antes);
    if (u.tipo!=='servico'){ const q = Number(antes.quantidade)||0; if (antes.valorUnitario==null) antes.valorUnitario = q>0 ? (Number(antes.valorTotal)||0)/q : 0; antes.valorTotal = round2(q*antes.valorUnitario); }
    if (ex) Object.assign(ex, antes); else list.push(antes);
    rest++;
  });
  h.desfeita = new Date().toISOString(); h.status = 'Excluída';
  h.detalhes = (h.detalhes||'') + ` · Excluída em ${fmtDateTime(h.desfeita)} (${[mIds.size?mIds.size+' mat.':'', sIds.size?sIds.size+' serv.':''].filter(Boolean).join(' e ')||'nenhum item'} removido(s)${rest?`, ${rest} restaurado(s)`:''})`;
  return {mats:mIds.size, svcs:sIds.size, rest};
}
async function askUndoImport(id){
  const p = cur(); const h = p.importacoes.find(x=>x.id===id); if (!h) return;
  const it = histItems(p, h);
  const val = round2(it.mats.reduce((a,m)=>a+round2(m.valorTotal),0) + it.svcs.reduce((a,s)=>a+svcTotal(s),0));
  const nu = (h.atualizados||[]).length;
  const ok = await confirmDialog({title:'Excluir importação', message:`<b>${esc(h.arquivo)}</b> <span class="muted">(${esc(h.formato)}, importado em ${fmtDateTime(h.data)})</span><br><br>
    Serão excluídos do projeto: <b>${it.mats.length}</b> material(is) e <b>${it.svcs.length}</b> serviço(s), somando <b>${fmtBRL(val)}</b>.
    ${it.mats.length+it.svcs.length ? '<br><span class="muted" style="font-size:12px">Itens editados depois da importação também serão excluídos.</span>':''}
    ${nu?`<br><br><label><input type="checkbox" id="undoRestore" checked> Restaurar os ${nu} registro(s) existentes que esta importação atualizou para os valores anteriores</label>`:''}
    ${it.legacy?'<div class="alert warn mt8" style="margin-bottom:0">Importação feita em versão anterior do sistema: serão excluídos os itens cuja origem é este arquivo.</div>':''}`, okText:'Excluir importação', danger:true});
  if (!ok) return;
  const restore = nu ? !!(confirmDialog.checks||{}).undoRestore : false;
  const r = undoImport(id, false, restore);
  touch(); go('importar');
  toast(`Importação excluída: ${r.mats} material(is) e ${r.svcs} serviço(s) removidos${r.rest?`, ${r.rest} restaurado(s)`:''}.`,'ok',5000);
}
function wizDone(){
  const t = totals(cur());
  const tot = imp.resumo.reduce((a,r)=>a+r.importados,0);
  const canUndo = imp.resumo.some(r=>r.histId && r.importados>0);
  return `<h2>${imp.queue.length>1?'Consolidação concluída':'Importação concluída'}</h2>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Arquivo</th><th>Status</th><th class="num">Itens importados</th><th>Detalhes</th></tr></thead><tbody>
  ${imp.resumo.map(r=>`<tr><td>${esc(r.arquivo)}</td><td>${esc(r.status)}</td><td class="num">${r.importados}</td><td class="muted">${esc(r.detalhes||'')}</td></tr>`).join('')}</tbody></table></div>
  <div class="alert ok mt16">Total de itens incorporados à mensuração: <b>${tot}</b>. Estimativa total atualizada do projeto: <b>${fmtBRL(t.total)}</b> (materiais de obra ${fmtBRL(t.obra)} · ativação ${fmtBRL(t.ativ)} · serviços ${fmtBRL(t.serv)}).</div>
  <div class="btns"><button class="btn primary" data-imp="close">${imp.preset ? `Ver ${imp.preset.categoria==='ativacao'?'materiais de ativação':'materiais de obra'}` : 'Importar outros arquivos'}</button><button class="btn" data-view="resumo">Ver resumo financeiro</button><button class="btn" data-view="dashboard">Ir para o dashboard</button>${canUndo?'<button class="btn danger" data-imp="undo-session">Desfazer importações desta sessão</button>':''}</div>`;
}

/* =====================================================================
   9. RELATÓRIO EM PDF (jsPDF + AutoTable)
   ===================================================================== */
const PDF_MODES = {
  completo: {titulo:'Relatório de Mensuração de Custos', banda:'MENSURAÇÃO DE CUSTOS DE PROJETO', arquivo:'Relatorio_completo_', msg:'Gerando relatório completo…'},
  materiais:{titulo:'Lista de Materiais', banda:'LISTA DE MATERIAIS', arquivo:'Lista_materiais_', msg:'Gerando lista de materiais…'},
  semcusto: {titulo:'Lista de Materiais (sem custos)', banda:'LISTA DE MATERIAIS', arquivo:'Lista_materiais_sem_custo_', msg:'Gerando lista de materiais sem custos…'},
  resumo:   {titulo:'Resumo Financeiro Consolidado', banda:'RESUMO FINANCEIRO CONSOLIDADO', arquivo:'Resumo_financeiro_', msg:'Gerando resumo financeiro…'}
};
async function gerarRelatorio(mode){
  mode = PDF_MODES[mode] ? mode : 'completo';
  const MD = PDF_MODES[mode];
  const soMat = mode==='materiais', semCusto = mode==='semcusto', soResumo = mode==='resumo';
  const p = cur(); if (!p) return toast('Nenhum projeto ativo.','err');
  if ((soMat || semCusto) && !p.materiais.length) return toast('O projeto não possui materiais cadastrados.','err');
  if (!p.info.nome.trim()){ toast('Informe o nome do projeto antes de gerar o relatório.','err'); return go('ident'); }
  toast(MD.msg);
  let jsPDF;
  try { jsPDF = await loadLib('jspdf'); await loadLib('autotable'); }
  catch(err){ return toast(err.message,'err',7000); }
  try {
    const o = db.settings.reportOpts || {descricao:true, empresas:true, vazias:true};
    const t = totals(p);
    const doc = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 16, TOP = 27, BOT = 38;
    /* Padrão do timbrado I_MAIS / CLICKIP (memoriais descritivos): azul-marinho, verde-azulado e laranja */
    const NAVY = [0,24,129], GRAY = [100,110,125], TEAL = [19,163,160], ORANGE = [255,115,0];
    let secN = 0;
    const money = n => fmtBRL(n);
    let y = TOP;
    const ensure = need => { if (y + need > H - BOT){ doc.addPage(); y = TOP; } };
    const section = (title) => { ensure(22); doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...NAVY); doc.text(`${++secN}. ${title.toUpperCase()}`, M, y); doc.setDrawColor(...ORANGE); doc.setLineWidth(.6); doc.line(M, y+1.8, M+45, y+1.8); y += 5.5; doc.setTextColor(30,30,30); };
    const tableOpts = (extra)=> Object.assign({
      startY:y, margin:{left:M, right:M, top:TOP, bottom:BOT}, theme:'grid', showHead:'everyPage', showFoot:'lastPage', rowPageBreak:'avoid',
      styles:{font:'helvetica', fontSize:8, cellPadding:1.6, lineColor:[210,215,224], lineWidth:.15, textColor:[30,36,50], overflow:'linebreak', valign:'middle'},
      headStyles:{fillColor:NAVY, textColor:255, fontStyle:'bold', fontSize:8},
      footStyles:{fillColor:[232,238,250], textColor:NAVY, fontStyle:'bold', fontSize:8.5},
      alternateRowStyles:{fillColor:[247,249,252]}
    }, extra);

    // Identificação
    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(...NAVY);
    doc.text(MD.titulo.toUpperCase(), M, y+2); y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...TEAL);
    doc.text(`${p.info.tipo?tipoLabel(p.info.tipo)+' – ':''}${p.info.nome||''}`.slice(0,95), M, y); y += 3.5;
    doc.setFillColor(...ORANGE); doc.rect(M, y, 34, 1.2, 'F'); y += 6;
    doc.autoTable(tableOpts({ startY:y, theme:'plain', showHead:false, showFoot:false,
      styles:{fontSize:9, cellPadding:1.5, textColor:[30,36,50]},
      columnStyles:{0:{fontStyle:'bold', textColor:GRAY, cellWidth:40}, 2:{fontStyle:'bold', textColor:GRAY, cellWidth:34}},
      body:[
        ['Projeto', p.info.nome||'-', 'Código', p.info.codigo||'-'],
        ['Cliente / empreendimento', p.info.cliente||'-', 'Data de elaboração', fmtDate(p.info.data)],
        ['Tipo de projeto', tipoLabel(p.info.tipo)||'-', 'Data de geração', new Date().toLocaleDateString('pt-BR')],
        ['Responsável', p.info.responsavel||'-', 'Elaborado por', currentUser ? currentUser.nome : '-'],
        ['Versão', p.info.versao||'1.0', 'Aprovação', (()=>{ const ai = aprovInfo(p); return ai.n ? `${ai.n} de ${APROVADORES.length}${ai.alterado?' (alterado após)':''}` : 'Pendente'; })()],
        ['Última alteração', p.alteradoPor ? `${p.alteradoPor.nome} em ${fmtDateTime(p.atualizadoEm)}` : '-', '', '']
      ]}));
    y = doc.lastAutoTable.finalY + 4;
    if (o.descricao && (mode==='completo' || soMat) && (p.info.descricao||p.info.observacoes)){
      const block = (lbl, txt)=>{ if(!txt) return; doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...GRAY); ensure(12); doc.text(lbl, M, y); y += 4.2;
        doc.setFont('helvetica','normal'); doc.setTextColor(30,36,50); const lines = doc.splitTextToSize(String(txt), W-2*M);
        lines.forEach(l=>{ ensure(5); doc.text(l, M, y); y += 4.2; }); y += 2; };
      block('Descrição do projeto', p.info.descricao); block('Observações gerais', p.info.observacoes);
    }
    y += 3;

    // Materiais
    const matTable = (cat, title, subtotal) => {
      const list = p.materiais.filter(m=>m.categoria===cat).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
      if (!list.length && !o.vazias) return;
      section(title);
      if (!list.length){ doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...GRAY); doc.text('Nenhum item cadastrado nesta categoria.', M, y+3); y += 12; return; }
      if (semCusto){
        doc.autoTable(tableOpts({
          head:[['Nº','Descrição do material','Unid.','Qtd.']],
          body:list.map(m=>[String(++itemN), m.nome, m.unidade, fmtNum(m.quantidade)]),
          foot:[[{content:`Total de itens - ${title}: ${list.length}`, colSpan:4, styles:{halign:'right'}}]],
          columnStyles:{0:{cellWidth:10,halign:'right'},1:{cellWidth:'auto'},2:{cellWidth:20},3:{cellWidth:22,halign:'right'}}
        }));
        y = doc.lastAutoTable.finalY + 9; return;
      }
      doc.autoTable(tableOpts({
        head:[['Descrição do material','Unid.','Qtd.','Valor unitário','Valor total']],
        body:list.map(m=>[m.nome, m.unidade, fmtNum(m.quantidade), money(unitValue(m)), money(m.valorTotal)]),
        foot:[[{content:`Subtotal - ${title} (${list.length} itens)`, colSpan:4, styles:{halign:'right'}}, {content:money(subtotal), styles:{halign:'right'}}]],
        columnStyles:{0:{cellWidth:'auto'},1:{cellWidth:17},2:{cellWidth:18,halign:'right'},3:{cellWidth:27,halign:'right'},4:{cellWidth:29,halign:'right'}}
      }));
      y = doc.lastAutoTable.finalY + 9;
    };
    let itemN = 0;
    if (!soResumo){
      matTable('obra','Relação de materiais de obra', t.obra);
      matTable('ativacao','Relação de materiais de ativação', t.ativ);
    }

    // Serviços
    const sv = p.servicos.slice().sort((a,b)=>(a.empresa||'').localeCompare(b.empresa||'','pt-BR')||(a.descricao||'').localeCompare(b.descricao||'','pt-BR'));
    if (mode==='completo' && (sv.length || o.vazias)){
      section('Relação de serviços e mão de obra');
      if (!sv.length){ doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...GRAY); doc.text('Nenhum serviço cadastrado.', M, y+3); y += 12; }
      else {
        doc.autoTable(tableOpts({
          head:[['Descrição do serviço','Prestadora / equipe','Unid.','Qtd.','Valor unitário','Valor total']],
          body:sv.map(s=>[s.descricao, s.empresa, s.unidade, fmtNum(s.quantidade), money(s.valorUnitario), money(svcTotal(s))]),
          foot:[[{content:`Subtotal - Serviços e mão de obra (${sv.length} itens)`, colSpan:5, styles:{halign:'right'}}, {content:money(t.serv), styles:{halign:'right'}}]],
          columnStyles:{0:{cellWidth:'auto'},1:{cellWidth:38},2:{cellWidth:16},3:{cellWidth:15,halign:'right'},4:{cellWidth:25,halign:'right'},5:{cellWidth:26,halign:'right'}}
        }));
        y = doc.lastAutoTable.finalY + 9;
      }
    }

    // Subtotais por empresa
    if (false){ // subtotais por empresa de origem removidos (materiais não usam mais empresa)
      section('Subtotais de materiais por empresa de origem');
      doc.autoTable(tableOpts({
        head:[['Empresa de origem','Itens','Materiais de obra','Materiais de ativação','Subtotal']],
        body:Object.entries(t.empresas).sort((a,b)=>b[1].total-a[1].total).map(([k,E])=>[k, String(E.n), money(E.obra), money(E.ativ), money(E.total)]),
        foot:[['Total', String(t.nMat), money(t.obra), money(t.ativ), money(t.mat)]],
        columnStyles:{1:{halign:'right',cellWidth:16},2:{halign:'right',cellWidth:34},3:{halign:'right',cellWidth:36},4:{halign:'right',cellWidth:32}},
        didParseCell:d=>{ if(d.section==='foot' && d.column.index>0) d.cell.styles.halign='right'; }
      }));
      y = doc.lastAutoTable.finalY + 9;
    }

    // Subtotais de serviços por prestadora
    if (mode==='completo' && o.empresas && Object.keys(t.servEmpresas).length){
      section('Subtotais de serviços por prestadora / equipe');
      doc.autoTable(tableOpts({
        head:[['Prestadora / equipe','Serviços','Subtotal','% dos serviços']],
        body:Object.entries(t.servEmpresas).sort((a,b)=>b[1].total-a[1].total).map(([k,E])=>[k, String(E.n), money(E.total), fmtPct(E.total,t.serv)]),
        foot:[['Total', String(t.nServ), money(t.serv), '100%']],
        columnStyles:{1:{halign:'right',cellWidth:20},2:{halign:'right',cellWidth:36},3:{halign:'right',cellWidth:30}},
        didParseCell:d=>{ if(d.section==='foot' && d.column.index>0) d.cell.styles.halign='right'; }
      }));
      y = doc.lastAutoTable.finalY + 9;
    }

    // Resumo financeiro consolidado
    if (semCusto){
      ensure(40);
      section('Resumo da lista de materiais');
      doc.autoTable(tableOpts({
        head:[['Categoria','Itens']],
        body:[['Materiais de obra', String(t.nObra)], ['Materiais de ativação', String(t.nAtiv)]],
        foot:[['TOTAL DE ITENS', String(t.nMat)]],
        footStyles:{fillColor:NAVY, textColor:255, fontStyle:'bold', fontSize:9.5}, pageBreak:'avoid',
        styles:{fontSize:9, cellPadding:2.2, lineColor:[210,215,224], lineWidth:.15},
        columnStyles:{1:{halign:'right',cellWidth:30}},
        didParseCell:d=>{ if(d.section==='foot' && d.column.index>0) d.cell.styles.halign='right'; }
      }));
      y = doc.lastAutoTable.finalY + 10;
    } else {
    ensure(60);
    section(soMat ? 'Resumo da lista de materiais' : 'Resumo financeiro consolidado');
    doc.autoTable(tableOpts({
      head:[['Descrição','Itens', 'Valor (R$)', soMat ? '% dos materiais' : '% do total']],
      body: soMat ? [
        ['Subtotal de materiais de obra', String(t.nObra), money(t.obra), fmtPct(t.obra,t.mat)],
        ['Subtotal de materiais de ativação', String(t.nAtiv), money(t.ativ), fmtPct(t.ativ,t.mat)]
      ] : [
        ['Subtotal de materiais de obra', String(t.nObra), money(t.obra), fmtPct(t.obra,t.total)],
        ['Subtotal de materiais de ativação', String(t.nAtiv), money(t.ativ), fmtPct(t.ativ,t.total)],
        ['Total geral de materiais', String(t.nMat), money(t.mat), fmtPct(t.mat,t.total)],
        ['Subtotal de serviços e mão de obra', String(t.nServ), money(t.serv), fmtPct(t.serv,t.total)]
      ],
      foot: soMat ? [['TOTAL GERAL DE MATERIAIS', String(t.nMat), money(t.mat), '100%']] : [['ESTIMATIVA TOTAL DE CUSTOS DO PROJETO', String(t.nMat+t.nServ), money(t.total), '100%']],
      footStyles:{fillColor:NAVY, textColor:255, fontStyle:'bold', fontSize:9.5},
      rowPageBreak:'avoid', pageBreak:'avoid',
      styles:{fontSize:9, cellPadding:2.2, lineColor:[210,215,224], lineWidth:.15},
      columnStyles:{1:{halign:'right',cellWidth:18},2:{halign:'right',cellWidth:42},3:{halign:'right',cellWidth:26}},
      didParseCell:d=>{ if(d.section==='foot' && d.column.index>0) d.cell.styles.halign='right'; if(!soMat && d.section==='body' && d.row.index===2) d.cell.styles.fontStyle='bold'; }
    }));
    y = doc.lastAutoTable.finalY + 10;
    }

    // Aprovação do projeto (registro no sistema — sem campo de assinatura)
    if (mode==='completo' || soResumo){
      const ai = aprovInfo(p);
      ensure(40); section('Aprovação do projeto');
      doc.autoTable(tableOpts({
        head:[['Aprovador','Cargo','Situação','Data e hora','Observação']],
        body: ai.list.map(a=>[a.nome, a.cargo, a.reg?'Aprovado':'Pendente', a.reg?fmtDateTime(a.reg.em):'-', a.reg&&a.reg.obs?a.reg.obs:'-']),
        columnStyles:{0:{cellWidth:34,fontStyle:'bold'},1:{cellWidth:40},2:{cellWidth:22},3:{cellWidth:30}},
        didParseCell:d=>{ if (d.section==='body' && d.column.index===2) d.cell.styles.textColor = d.cell.raw==='Aprovado' ? [21,128,61] : GRAY; }
      }));
      y = doc.lastAutoTable.finalY + 4;
      if (ai.alterado){ doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(180,83,9); ensure(8); doc.text(`Atenção: o projeto foi alterado após a aprovação (${p.alteradoPor?p.alteradoPor.nome:''} em ${fmtDateTime(p.conteudoAlteradoEm)}).`, M, y+2); y += 8; }
      y += 6;
    }

    // Cabeçalho e rodapé em todas as páginas (timbrado)
    const n = doc.getNumberOfPages(); const gen = new Date().toLocaleString('pt-BR');
    const empresaRel = db.settings.empresaRelatorio || EMPRESA_PADRAO, depto = db.settings.departamento || 'Engenharia / Projetos', cidade = db.settings.cidade || 'Manaus';
    const dataExt = (()=>{ const d = p.info.data ? new Date(p.info.data+'T12:00:00') : new Date(); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR',{day:'2-digit', month:'long', year:'numeric'}); })();
    for (let i=1;i<=n;i++){
      doc.setPage(i);
      // Papel timbrado: faixa laranja/azul no topo e rodapé Grupo ClickIP (telefones e site) em todas as páginas
      try { doc.addImage(LOGOS.timbreTopo, 'PNG', 0, 0, W, TIMBRE.topoH); doc.addImage(LOGOS.timbreRodape, 'PNG', 0, TIMBRE.rodapeY, W, TIMBRE.rodapeH); } catch(e){ console.warn('timbrado', e); }
      doc.setTextColor(...GRAY); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
      doc.text(MD.banda, W-M, 15, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(7.8);
      doc.text(`${p.info.tipo?tipoLabel(p.info.tipo).toUpperCase()+' – ':''}${String(p.info.nome||'').toUpperCase()}`.slice(0,70), W-M, 19, {align:'right'});
      doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(8);
      doc.text(empresaRel.slice(0,60), M, 15);
      doc.setFont('helvetica','normal'); doc.setTextColor(...GRAY); doc.setFontSize(7.5);
      doc.text(depto, M, 19);
      doc.setDrawColor(...NAVY); doc.setLineWidth(.4); doc.line(M, 22, W-M, 22);
      const fy = TIMBRE.rodapeY - 7;
      doc.setDrawColor(210,215,224); doc.setLineWidth(.2); doc.line(M, fy-3.5, W-M, fy-3.5);
      doc.setFontSize(7.2); doc.setTextColor(...GRAY);
      doc.text(`Versão ${p.info.versao||'1.0'} – ${cidade}, ${dataExt}`, M, fy);
      doc.text(`Gerado em ${gen}${currentUser?' por '+currentUser.nome.slice(0,40):''}`, W/2, fy, {align:'center'});
      doc.text(`Página ${i} de ${n}`, W-M, fy, {align:'right'});
    }
    const fname = `${MD.arquivo}${p.info.codigo?fileSafe(p.info.codigo)+'_':''}${fileSafe(p.info.nome)}.pdf`;
    doc.save(fname);
    p.ultimoRelatorio = new Date().toISOString(); saveDB();
    toast('PDF gerado: '+fname,'ok',4500);
  } catch(err){ console.error(err); toast('Erro ao gerar o PDF: '+err.message,'err',7000); }
}

const SESSION_KEY = 'mensuracaoCustos.session';

const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function getSession(){
  try { return sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY); } catch(e){ return null; }
}
function setSession(id, remember){
  try { sessionStorage.setItem(SESSION_KEY, id); if (remember) localStorage.setItem(SESSION_KEY, id); else localStorage.removeItem(SESSION_KEY); } catch(e){}
}
function clearSession(){ try { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); } catch(e){} }

      ${first && db.projects.length ? `<div class="alert info" style="font-size:12.5px">Existem ${db.projects.length} projeto(s) salvos neste navegador. Eles ficarão disponíveis para todos os perfis.</div>`:''}
      <div class="fld"><label>Nome completo <span class="req">*</span></label><input class="inp" name="nome" autocomplete="name" required></div>
      <div class="fld"><label>E-mail <span class="req">*</span></label><input class="inp" name="email" type="email" autocomplete="username" required></div>
      <div class="fld"><label>Senha <span class="req">*</span> <span class="muted">(mínimo 6 caracteres)</span></label><input class="inp" name="senha" type="password" autocomplete="new-password" required></div>
      <div class="fld"><label>Confirmar senha <span class="req">*</span></label><input class="inp" name="senha2" type="password" autocomplete="new-password" required></div>
      <label style="font-size:13px;display:flex;gap:7px;align-items:center"><input type="checkbox" name="lembrar" checked> Manter conectado neste computador</label>
      <div class="auth-err" id="authErr"></div>
      <button class="btn primary" type="submit">Criar perfil e entrar</button>
    </form>`}
    <div class="auth-shared">${SYNC.handle ? (SYNC.ok ? `<b style="color:var(--ok)">● Banco compartilhado conectado:</b> ${esc(SYNC.nome)} — perfis e projetos de todos os usuários.` : `Banco compartilhado <b>${esc(SYNC.nome)}</b> aguardando permissão.<div class="btns"><button type="button" class="btn sm primary" data-action="shared-reconnect">Reconectar banco compartilhado</button></div>`)
      : (fsSupported() ? `Para usar os mesmos perfis e projetos de outros computadores, conecte o arquivo do banco compartilhado (pasta do Google Drive para computador, OneDrive ou rede).<div class="btns"><button type="button" class="btn sm" data-action="shared-open">Conectar banco compartilhado</button><button type="button" class="btn sm" data-action="shared-new">Criar banco compartilhado</button></div>` : '')}</div>
    <div class="auth-foot"><span>${SYNC.handle&&SYNC.ok?'Dados sincronizados com o banco compartilhado.':'Perfis e dados ficam salvos neste navegador.'}</span><button type="button" class="btn sm" id="authTheme" data-action="theme"></button></div>
  </div>`;
  applyTheme();
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick = ()=>showAuth(b.dataset.tab));
  const err = m => { $('#authErr').textContent = m; };
  const fl = $('#fLogin'), fc = $('#fCriar');
  if (fl){
    setTimeout(()=>fl.email.focus(), 30);
    fl.onsubmit = e=>{
      e.preventDefault();
      const email = norm(fl.email.value), senha = fl.senha.value;
      if (!email || !senha) return err('Informe e-mail e senha.');
      const u = db.users.find(x=>norm(x.email)===email);
      if (!u || hashPwd(senha, u.salt)!==u.hash) return err('E-mail ou senha incorretos.');
      setSession(u.id, fl.lembrar.checked); startApp(u);
      toast('Bem-vindo(a), '+u.nome.split(' ')[0]+'!','ok');
    };
  }
  if (fc){
    setTimeout(()=>fc.nome.focus(), 30);
    fc.onsubmit = e=>{
      e.preventDefault();
      const nome = fc.nome.value.trim().replace(/\s+/g,' '), email = fc.email.value.trim().toLowerCase(), s1 = fc.senha.value, s2 = fc.senha2.value;
      if (nome.length<2) return err('Informe seu nome.');
      if (!validEmail(email)) return err('Informe um e-mail válido.');
      if (db.users.some(x=>norm(x.email)===norm(email))) return err('Já existe um perfil com este e-mail. Use "Entrar".');
      if (s1.length<6) return err('A senha deve ter pelo menos 6 caracteres.');
      if (s1!==s2) return err('As senhas não conferem.');
      const salt = newSalt();
      const u = {id:uid(), nome, email, salt, hash:hashPwd(s1, salt), criadoEm:new Date().toISOString()};
      const wasFirst = !db.users.length;
      db.users.push(u);
      if (wasFirst) db.projects.forEach(p=>{ if(!p.ownerId) p.ownerId = u.id; if(!p.criadoPor) p.criadoPor = {uid:u.id, nome:u.nome}; });
      setSession(u.id, fc.lembrar.checked);
      startApp(u);
      toast('Perfil criado. Bem-vindo(a), '+nome.split(' ')[0]+'!','ok');
    };
  }
}
function startApp(u){
  currentUser = u;
  const a = $('#auth'); if (a) a.remove();
  $('.app').classList.remove('hidden');
  db.currentByUser = db.currentByUser || {};
  db.currentId = db.currentByUser[u.id];
  if (!myProjects().length){ const np = newProject(); db.projects.push(np); db.currentId = np.id; }
  if (!cur()) db.currentId = myProjects()[0].id;
  u.ultimoAcesso = new Date().toISOString();
  saveDB(); renderUser(); renderSyncStatus(); view = 'dashboard'; go('dashboard');
}
function renderUser(){
  if (!currentUser) return;
  $('#uAv').textContent = initials(currentUser.nome);
  $('#uName').textContent = currentUser.nome.split(' ')[0];
  applyTheme();
}
function logout(){
  if (currentUser){ db.currentByUser[currentUser.id] = db.currentId; saveDB(); }
  clearSession(); showAuth('entrar');
}
function profileForm(){
  const u = currentUser; if (!u) return;
  const ov = openModal(`<div class="mh"><h3>Meu perfil</h3><button class="btn icon" data-x>${icon('x')}</button></div>
  <div class="mb"><div class="form-grid">
    <div class="fld span2"><label>Nome <span class="req">*</span></label><input class="inp" name="nome" value="${esc(u.nome)}"><div class="msg"></div></div>
    <div class="fld"><label>Perfil criado em</label><input class="inp" readonly value="${esc(fmtDateTime(u.criadoEm))}"></div>
    <div class="fld span2"><label>E-mail <span class="req">*</span></label><input class="inp" name="email" type="email" value="${esc(u.email)}"><div class="msg"></div></div>
    <div></div>
    <div class="fld full"><h2 style="margin:6px 0 0;font-size:14px;color:var(--heading)">Alterar senha <span class="muted" style="font-weight:400;font-size:12px">(deixe em branco para manter)</span></h2></div>
    <div class="fld"><label>Senha atual</label><input class="inp" name="atual" type="password" autocomplete="current-password"><div class="msg"></div></div>
    <div class="fld"><label>Nova senha</label><input class="inp" name="nova" type="password" autocomplete="new-password"><div class="msg"></div></div>
    <div class="fld"><label>Confirmar nova senha</label><input class="inp" name="nova2" type="password" autocomplete="new-password"><div class="msg"></div></div>
  </div></div>
  <div class="mf" style="justify-content:space-between"><button class="btn danger" data-del>${icon('trash')}Excluir meu perfil</button><div class="btns"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-save>Salvar</button></div></div>`);
  const F = n => ov.querySelector(`[name="${n}"]`);
  ov.addEventListener('click', async e=>{
    if (e.target.closest('[data-x]')) return closeModal(ov);
    if (e.target.closest('[data-del]')){
      const n = myProjects().length;
      if (!(await confirmDialog({title:'Excluir perfil', message:`O perfil <b>${esc(u.nome)}</b> será excluído. Os projetos criados por ele continuam disponíveis para os demais usuários (com o histórico de alterações).`, okText:'Continuar', danger:true}))) return;
      if (!(await confirmDialog({title:'Confirmação final', message:'Esta ação é irreversível. Excluir o perfil?', okText:'Excluir perfil', danger:true}))) return;
      db.users = db.users.filter(x=>x.id!==u.id); markDeleted(u.id); delete db.currentByUser[u.id];
      closeModal(ov); currentUser = null; saveDB(); clearSession(); showAuth(); toast('Perfil excluído.'); return;
    }
    if (!e.target.closest('[data-save]')) return;
    const nome = F('nome').value.trim().replace(/\s+/g,' '), email = F('email').value.trim().toLowerCase();
    const atual = F('atual').value, nova = F('nova').value, nova2 = F('nova2').value;
    const errs = {};
    if (nome.length<2) errs.nome = 'Informe o nome.';
    if (!validEmail(email)) errs.email = 'E-mail inválido.';
    else if (db.users.some(x=>x.id!==u.id && norm(x.email)===norm(email))) errs.email = 'E-mail já usado por outro perfil.';
    if (atual || nova || nova2){
      if (hashPwd(atual, u.salt)!==u.hash) errs.atual = 'Senha atual incorreta.';
      if (nova.length<6) errs.nova = 'Mínimo de 6 caracteres.';
      if (nova!==nova2) errs.nova2 = 'As senhas não conferem.';
    }
    $$('.fld', ov).forEach(fl=>{ const i=fl.querySelector('[name]'); if(!i) return; const m=errs[i.name]||''; i.classList.toggle('err',!!m); const mm=fl.querySelector('.msg'); if(mm) mm.textContent=m; });
    if (Object.keys(errs).length) return;
    u.nome = nome; u.email = email; u.atualizadoEm = new Date().toISOString();
    if (nova){ u.salt = newSalt(); u.hash = hashPwd(nova, u.salt); }
    saveDB(); renderUser(); closeModal(ov); go(); toast(nova?'Perfil e senha atualizados.':'Perfil atualizado.','ok');
  });
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
async function importCatalog(file){
  try {

    else { const X = await loadLib('xlsx'); const wb = X.read(new Uint8Array(await file.arrayBuffer()), {type:'array'}); sheets = wb.SheetNames.map(n=>({name:n, rows:sheetRows(wb.Sheets[n])})); }
    const res = [];
    for (const sh of sheets){
      const det = detectHeader(sh.rows, 'materiais'); if (!det || det.mapping.codigo==null || det.mapping.nome==null) continue;
      const m = det.mapping; const vcol = m.valorUnitario!=null ? m.valorUnitario : m.valorTotal;
      const itens = [];
      for (let i=det.row+1;i<sh.rows.length;i++){ const r = sh.rows[i]||[]; const cod = String(r[m.codigo]==null?'':r[m.codigo]).trim(); const desc = String(r[m.nome]==null?'':r[m.nome]).replace(/\s+/g,' ').trim();
        if (!cod || !desc || TOTAL_LINE.test(norm(desc))) continue;
        const v = vcol!=null ? parseBR(r[vcol]) : null;
        itens.push({codigo:cod, descricao:desc, unidade: m.unidade!=null ? (normalizeUnit(r[m.unidade])||'Unidade') : (/^cabo /i.test(desc)?'Metro':'Unidade'), valor: v==null?0:Math.max(0,v), tabela: sh.name, fonte: file.name}); }
      if (itens.length) res.push({tabela:sh.name, itens});
    }
    if (!res.length) return toast('Nenhuma aba com colunas de código e descrição foi reconhecida.','err',6000);
    const ok = await confirmDialog({title:'Importar catálogo', message:`<b>${esc(file.name)}</b><br><br>${res.map(r=>`Aba <b>${esc(r.tabela)}</b>: ${r.itens.length} item(ns)`).join('<br>')}<br><br><label><input type="checkbox" id="catReplace" checked> Substituir os itens existentes das tabelas com o mesmo nome</label>`, okText:'Importar'});
    if (!ok) return;

  } catch(err){ toast('Erro ao importar o catálogo: '+err.message,'err',7000); }

/* =====================================================================
   12a-2. BUSCA DE MATERIAIS NO CATÁLOGO PELA DESCRIÇÃO (correspondência aproximada)
   Compara as palavras da descrição do documento com as do catálogo. Números e especificações
   (ex.: 12FO, 1X16, 1200MM, AS80) pesam mais, para não confundir cabos/caixas de tamanhos diferentes.
   ===================================================================== */
const CAT_OK = 0.62, CAT_SUG = 0.45;
const CAT_STOP = new Set('de da do das dos para p c com e a o em sem tipo the of ou x'.split(' '));
const CAT_TAB_NOME = {'01':'ClickIP','02':'Intlink','03':'Fiber'};
const catTabLabel = t => t ? (CAT_TAB_NOME[t] ? `${t} · ${CAT_TAB_NOME[t]}` : t) : '';
function catToks(s){ return [...new Set(normKey(s).split(' ').filter(t=>t && !CAT_STOP.has(t) && !(t.length===1 && !/\d/.test(t))))]; }
let CATIDX = null;
function catIndex(){
  const cat = catalogo(); const key = cat.length + '|' + (db.catalogoAtualizadoEm||'');
  if (CATIDX && CATIDX.key===key && CATIDX.cat===cat) return CATIDX;
  const inv = new Map(); const add = (k,it)=>{ let a = inv.get(k); if (!a) inv.set(k, a=[]); a.push(it); };
  const items = cat.map((x,i)=>({x, i, t:catToks(x.descricao)}));
  items.forEach(it=>it.t.forEach(t=>{ add(t, it); if (t.length>=5 && !/\d/.test(t)) add('~'+t.slice(0,5), it); }));
  return CATIDX = {key, cat, items, inv};
}
const tokW = t => /\d/.test(t) ? 2 : (t.length<=3 ? 0.8 : 1);
const tokShape = t => t.replace(/\d+/g,'#');
/* Especificações conflitantes: mesmo "formato" com números diferentes (ex.: 20a × 10a, 12fo × 24fo, 430 × 304) */
function specConflicts(A, B){
  const sa = new Set(A), sb = new Set(B); let n = 0;
  const shB = new Map(); B.forEach(b=>{ if (/\d/.test(b) && !sa.has(b)) shB.set(tokShape(b), true); });
  A.forEach(a=>{ if (/\d/.test(a) && !sb.has(a) && shB.has(tokShape(a))) n++; });
  return n;
}
function tokSim(a, b){
  if (a===b) return 1;
  if (/\d/.test(a) || /\d/.test(b)) return 0;
  if (a.length>=5 && b.length>=5 && a.slice(0,5)===b.slice(0,5) && Math.abs(a.length-b.length)<=3) return 0.85;
  return 0;
}
function catScore(A, B){
  const side = (X, Y)=>{ let w=0, m=0; for (const a of X){ const k = tokW(a); w += k; let best = 0; for (const b of Y){ const s = tokSim(a,b); if (s>best){ best = s; if (s===1) break; } } m += k*best; } return w ? m/w : 0; };
  return 0.6*side(A,B) + 0.4*side(B,A);
}
/* Retorna até n itens do catálogo [{item, i, s}] ordenados pela semelhança com a descrição */
function catalogMatch(nome, n){
  const A = catToks(nome); if (!A.length) return [];
  const ix = catIndex(); const cand = new Set();
  A.forEach(t=>{ (ix.inv.get(t)||[]).forEach(it=>cand.add(it)); if (t.length>=5 && !/\d/.test(t)) (ix.inv.get('~'+t.slice(0,5))||[]).forEach(it=>cand.add(it)); });
  const pref = db.settings.catalogoTabela || '';
  const res = [];
  cand.forEach(it=>{ const c = specConflicts(A, it.t); const s = catScore(A, it.t) * Math.pow(0.7, c); if (s < 0.3) return; res.push({item:it.x, i:it.i, s, c, r: s + (pref && it.x.tabela===pref ? 0.03 : 0) + (it.x.valor>0 ? 0.02 : 0)}); });
  res.sort((a,b)=>b.r-a.r);
  return res.slice(0, n||5);
}
function catalogBest(nome){ const m = catalogMatch(nome, 1)[0]; return m && m.s>=CAT_SUG && !m.c ? m : null; }
const pctTxt = s => Math.round(Math.min(1,s)*100)+'%';
/* Aplica o catálogo a uma linha de importação de material (preço, unidade e, opcionalmente, descrição) */
function applyCatalogRow(r, cfg, force){
  if (r.categoria==='servico' || cfg.catalogo===false) return;
  if (r._catDone && !force) return;
  r._catDone = true;
  if (r.nomeArquivo==null) r.nomeArquivo = r.nome;
  if (r.valorArquivo==null) r.valorArquivo = r.valorUnitario;
  r.catOpts = catalogMatch(r.nomeArquivo, 6).filter(m=>m.s>=0.35).map(m=>({i:m.i, s:m.s, c:m.c}));
  const best = r.catOpts[0];
  r.catSel = best && best.s>=CAT_SUG && !best.c ? best.i : -1;   // especificação diferente (ex.: 20A × 10A) não é escolhida automaticamente
  setCatalogChoice(r, cfg);
}
function setCatalogChoice(r, cfg){
  const cat = catalogo(); const it = r.catSel>=0 ? cat[r.catSel] : null; const opt = (r.catOpts||[]).find(o=>o.i===r.catSel);
  r.aviso = String(r.aviso||'').split(' · ').filter(x=>x && !/catálogo/i.test(x)).join(' · ');
  const addAviso = t => { r.aviso = r.aviso ? r.aviso+' · '+t : t; };
  if (it){
    r.valorUnitario = it.valor>0 ? it.valor : (r.valorArquivo||0);
    if (!it.valor) addAviso('Item do catálogo sem valor — informe o valor unitário');
    if (cfg.catNome!==false && opt && opt.s>=CAT_OK) r.nome = it.descricao; else r.nome = r.nomeArquivo;
    if (!r.unidadeArquivo) r.unidadeArquivo = r.unidade || '';
    if (!r.unidadeArquivo || r.unidadeArquivo==='Unidade') r.unidade = it.unidade || r.unidade || 'Unidade';
    if (opt && opt.s<CAT_OK) addAviso('Correspondência aproximada no catálogo — confira o item escolhido');
  } else {
    r.valorUnitario = r.valorArquivo || 0; r.nome = r.nomeArquivo;
    addAviso(r.valorUnitario ? 'Não encontrado no catálogo — mantido o valor do arquivo' : 'Não encontrado no catálogo — informe o valor unitário');
  }

}

}

/* =====================================================================
   12b. CALCULADORA DE ALÇA E LAÇO (ferragens por postes)
   Regra das planilhas de levantamento: ancoragens = postes - 1; dupla ≈ postes/3 - 1; simples = 2 (pontas);
   suspensão = restante. BAP = simples+suspensão+dupla; SUPA = simples+suspensão+2×dupla; ALÇA = simples+2×dupla; LAÇO = suspensão.
   Margens padrão: BAP +10%, SUPA +10%, ALÇA +80%, LAÇO +20% (arredondado para cima).
   ===================================================================== */
const CALC_CABOS = {
  fino: {label:'Cabo 06FO / 12FO (6,8 a 7,5 mm)', alca:'9', laco:'75'},
  medio:{label:'Cabo 24FO a 48FO (8,4 a 9,0 mm)', alca:'475', laco:'869'}
};
function calcFerragens(postes, simples, dupla, susp, mg){
  const BAP = simples+susp+dupla, SUPA = simples+susp+2*dupla, ALCA = simples+2*dupla, LACO = susp;
  const up = (v,p)=> Math.ceil(v*(1+p/100) - 1e-9);
  return {BAP, SUPA, ALCA, LACO, qBAP:up(BAP,mg.bap), qSUPA:up(SUPA,mg.supa), qALCA:up(ALCA,mg.alca), qLACO:up(LACO,mg.laco)};
}

  const ov = openModal(`<div class="mh"><h3>Calculadora de alça e laço (ferragens por postes)</h3><button class="btn icon" data-x>${icon('x')}</button></div>

    </div>

  };
  draw();
  ['#cPostes','#cSim','#cSus','#cDup'].forEach(id=>$(id,ov).addEventListener('input', ()=>{ if (id!=='#cPostes') $('#cAuto',ov).checked = false; draw(); }));

function copyListForm(cat){
  const p = cur(); if (!p) return;
  const fontes = db.projects.filter(x=>x.id!==p.id && (x.materiais.length || x.servicos.length)).sort((a,b)=>String(b.atualizadoEm).localeCompare(String(a.atualizadoEm)));

  const st = {src:fontes[0].id, obra:cat!=='ativacao', ativ:cat!=='obra', svc:false, fator:1, valores:'origem', dup:'ignorar'};
  const ov = openModal(`<div class="mh"><h3>Usar uma cópia da lista de outro projeto</h3><button class="btn icon" data-x>${icon('x')}</button></div>

    <div class="form-grid">
      <div class="fld full"><label>Projeto de origem</label><select class="inp" id="clSrc">${fontes.map(x=>`<option value="${x.id}">${esc(x.info.nome||'(sem nome)')}${x.info.tipo?' · '+esc(tipoLabel(x.info.tipo)):''}${x.info.cliente?' · '+esc(x.info.cliente):''} — ${x.materiais.length} materiais, ${x.servicos.length} serviços${x.criadoPor?' · criado por '+esc(x.criadoPor.nome):''}</option>`).join('')}</select></div>
      <div class="fld"><label>Copiar</label><label style="font-weight:400"><input type="checkbox" id="clObra" ${st.obra?'checked':''}> Materiais de obra</label><label style="font-weight:400"><input type="checkbox" id="clAtiv" ${st.ativ?'checked':''}> Materiais de ativação</label><label style="font-weight:400"><input type="checkbox" id="clSvc"> Serviços e mão de obra</label></div>
      <div class="fld"><label>Quantidades</label><select class="inp" id="clQtdMode"><option value="1">Manter as quantidades</option><option value="f">Multiplicar por um fator</option></select><input class="inp num mt8" id="clFator" value="1" style="display:none" placeholder="Fator (ex.: 2 ou 0,5)"></div>
      <div class="fld"><label>Valores unitários</label><select class="inp" id="clVal"><option value="origem">Manter os do projeto de origem</option><option value="catalogo">Atualizar pelo catálogo (quando houver)</option></select>
        <label style="margin-top:8px">Itens já existentes neste projeto</label><select class="inp" id="clDup"><option value="ignorar">Ignorar</option><option value="somar">Somar a quantidade</option><option value="novo">Adicionar separado</option></select></div>
    </div>
    <div class="tbl-wrap mt8" style="max-height:42vh"><table class="tbl compact"><thead><tr><th><input type="checkbox" id="clAll" checked></th><th>Tipo</th><th>Descrição</th><th>Unid.</th><th class="num">Qtd.</th><th class="num">Valor unit.</th><th class="num">Total</th><th>Neste projeto</th></tr></thead><tbody id="clRows"></tbody></table></div>
    <div class="foot-sum" id="clSum"></div>
  </div>
  <div class="mf"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Copiar para este projeto</button></div>`, {size:'lg'});
  let rows = [];
  const build = ()=>{
    const src = db.projects.find(x=>x.id===$('#clSrc',ov).value);
    const fator = $('#clQtdMode',ov).value==='f' ? (parseBR($('#clFator',ov).value)||0) : 1;

      const bm = useCat ? catalogBest(m.nome) : null; const it = bm && bm.item.valor>0 ? bm.item : null; const key = 'm'+m.id;

  $('#clRows',ov).addEventListener('change', e=>{ const tr = e.target.closest('tr[data-i]'); if (!tr) return; rows[+tr.dataset.i].sel = e.target.checked; build(); });
  ov.addEventListener('click', e=>{
    if (e.target.closest('[data-x]')) return closeModal(ov);
    if (!e.target.closest('[data-ok]')) return;
    const src = db.projects.find(x=>x.id===$('#clSrc',ov).value); const dup = $('#clDup',ov).value;
    const sel = rows.filter(r=>r.sel && r.quantidade>0);
    if (!sel.length) return toast('Nenhum item selecionado (ou quantidade zero).','err');

      else p.materiais.push({id:uid(), origem, empresa:'', codigo:'', nome:r.nome, categoria:r.tipo, unidade:r.unidade, quantidade:r.quantidade, valorUnitario:r.valorUnitario, valorTotal:round2(r.quantidade*r.valorUnitario)});
      nNew++;

    touch(`Lista copiada de "${src.info.nome}": ${nNew} novo(s), ${nSum} somado(s)`); closeModal(ov); go();
    toast(`${nNew} item(ns) copiado(s)${nSum?`, ${nSum} quantidade(s) somada(s)`:''}${nIgn?`, ${nIgn} já existente(s) ignorado(s)`:''}.`,'ok',5500);
  });
}

const isAprovador = (u, a) => { if (!u) return false; const tk = new Set(normKey(u.nome).split(' ')); return normKey(a.nome).split(' ').every(t=>tk.has(t)); };

async function aprovar(id, revogar){
  const p = cur(); const a = APROVADORES.find(x=>x.id===id); if (!p || !a) return;
  if (!isAprovador(currentUser, a)) return toast(`Somente ${a.nome} pode registrar esta aprovação.`,'err');
  if (revogar){
    if (!(await confirmDialog({title:'Revogar aprovação', message:`Revogar a aprovação de <b>${esc(a.nome)}</b> para o projeto <b>${esc(p.info.nome)}</b>?`, okText:'Revogar', danger:true}))) return;
    p.aprovacoes = p.aprovacoes || {}; p.aprovacoes[id] = {status:'revogado', em:new Date().toISOString(), porUid:currentUser.id, porNome:currentUser.nome};
    touch(`Aprovação revogada por ${a.nome} (${a.cargo})`, true); go(); return;
  }
  const ok = await confirmDialog({title:'Aprovar projeto', message:`Registrar a aprovação de <b>${esc(a.nome)}</b> (${esc(a.cargo)}) para o projeto <b>${esc(p.info.nome)}</b>, com estimativa total de <b>${fmtBRL(totals(p).total)}</b>?<br><br><label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Observação (opcional)</label><textarea class="inp" id="aprovObs" rows="3"></textarea>`, okText:'Aprovar'});
  if (!ok) return;
  p.aprovacoes = p.aprovacoes || {};
  p.aprovacoes[id] = {status:'aprovado', em:new Date().toISOString(), porUid:currentUser.id, porNome:currentUser.nome, obs:(confirmDialog.texts||{}).aprovObs||'', total:totals(p).total};
  touch(`Projeto aprovado por ${a.nome} (${a.cargo})`, true); go(); toast('Aprovação registrada.','ok');
}

const ACAO_VIEW = {ident:'Identificação do projeto alterada', obra:'Materiais de obra alterados', ativacao:'Materiais de ativação alterados', servicos:'Serviços e mão de obra alterados', importar:'Importação de documentos', prestadoras:'Prestadoras alteradas', aprovacao:'Aprovação', resumo:'Projeto alterado', relatorios:'Projeto alterado'};
function logAlteracao(p, acao){
  if (!p || !currentUser) return;
  const now = new Date().toISOString(); p.historico = p.historico || [];
  const last = p.historico[p.historico.length-1];
  if (last && last.uid===currentUser.id && last.acao===acao && (Date.parse(now) - Date.parse(last.em)) < 180000){ last.em = now; last.n = (last.n||1)+1; }
  else p.historico.push({em:now, uid:currentUser.id, nome:currentUser.nome, acao});
  if (p.historico.length>500) p.historico.splice(0, p.historico.length-500);
  p.alteradoPor = {uid:currentUser.id, nome:currentUser.nome};
}

/* =====================================================================
   12f. BANCO DE DADOS COMPARTILHADO (arquivo .json em pasta compartilhada)
   Permite que todos os usuários, em computadores diferentes, trabalhem nos mesmos projetos:
   o arquivo fica numa pasta sincronizada (Google Drive para computador, OneDrive, rede).
   ===================================================================== */
const SYNC = {handle:null, ok:false, lastMod:0, busy:false, err:'', last:null, pending:false, nome:''};
const kv = {
  open(){ return new Promise((res,rej)=>{ const r = indexedDB.open('mensuracaoCustos', 1); r.onupgradeneeded = ()=>r.result.createObjectStore('kv'); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); },
  async get(k){ const d = await this.open(); return new Promise((res,rej)=>{ const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); }); },
  async set(k,v){ const d = await this.open(); return new Promise((res,rej)=>{ const q = d.transaction('kv','readwrite').objectStore('kv').put(v,k); q.onsuccess = ()=>res(); q.onerror = ()=>rej(q.error); }); },
  async del(k){ const d = await this.open(); return new Promise((res,rej)=>{ const q = d.transaction('kv','readwrite').objectStore('kv').delete(k); q.onsuccess = ()=>res(); q.onerror = ()=>rej(q.error); }); }
};
const fsSupported = ()=> typeof window.showSaveFilePicker==='function' && typeof window.showOpenFilePicker==='function';
const stamp = o => (o && (o.atualizadoEm || o.criadoEm)) || '';
function sharedPart(d){ return {app:'mensuracao-custos', tipo:'banco-compartilhado', version:4, salvoEm:new Date().toISOString(), users:d.users||[], projects:d.projects||[], prestadoras:d.prestadoras||[], catalogo:d.catalogo, catalogoAtualizadoEm:d.catalogoAtualizadoEm||'', excluidos:d.excluidos||{}}; }
/* Junta duas versões do banco: em cada projeto/usuário/prestadora vale a versão alterada por último; exclusões são respeitadas. */
function mergeDB(local, remote){
  const out = Object.assign({}, local);
  const exc = Object.assign({}, remote.excluidos||{});
  Object.entries(local.excluidos||{}).forEach(([k,v])=>{ if (!exc[k] || v>exc[k]) exc[k]=v; });
  const mergeList = (a, b)=>{ const m = new Map(); [...(a||[]), ...(b||[])].forEach(x=>{ if (!x || !x.id) return; const e = m.get(x.id); if (!e || stamp(x) > stamp(e)) m.set(x.id, x); });
    return [...m.values()].filter(x=>!(exc[x.id] && exc[x.id] >= stamp(x))); };
  out.users = mergeList(local.users, remote.users);
  out.projects = mergeList(local.projects, remote.projects).map(fixProject);
  out.prestadoras = mergeList(local.prestadoras, remote.prestadoras);
  if (remote.catalogo && (remote.catalogoAtualizadoEm||'') > (local.catalogoAtualizadoEm||'')){ out.catalogo = remote.catalogo; out.catalogoAtualizadoEm = remote.catalogoAtualizadoEm; }
  out.excluidos = exc;
  return out;
}
function markDeleted(id){ db.excluidos = db.excluidos || {}; db.excluidos[id] = new Date().toISOString(); }
let syncTimer = null;
function scheduleSync(){ if (!SYNC.handle || !SYNC.ok) return; clearTimeout(syncTimer); syncTimer = setTimeout(()=>syncNow(), 1200); }
async function syncNow(){
  if (!SYNC.handle || !SYNC.ok) return;
  if (SYNC.busy){ SYNC.pending = true; return; }
  SYNC.busy = true; renderSyncStatus();
  try {
    const f = await SYNC.handle.getFile();
    let remote = null;
    if (f.size){ try { remote = JSON.parse(await f.text()); } catch(e){ throw new Error('O arquivo compartilhado não é um banco válido desta ferramenta.'); } }
    const before = JSON.stringify(sharedPart(db).projects) + JSON.stringify(db.users) + JSON.stringify(db.prestadoras) + (db.catalogoAtualizadoEm||'');
    if (remote && remote.app==='mensuracao-custos') db = mergeDB(db, remote);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch(e){}
    const w = await SYNC.handle.createWritable(); await w.write(JSON.stringify(sharedPart(db))); await w.close();
    SYNC.lastMod = (await SYNC.handle.getFile()).lastModified; SYNC.err = ''; SYNC.last = new Date();
    const after = JSON.stringify(sharedPart(db).projects) + JSON.stringify(db.users) + JSON.stringify(db.prestadoras) + (db.catalogoAtualizadoEm||'');
    if (before!==after) onSharedChange();
  } catch(e){ SYNC.err = e.message || String(e); if (/permission|NotAllowed/i.test(SYNC.err)) SYNC.ok = false; }
  finally { SYNC.busy = false; renderSyncStatus(); if (SYNC.pending){ SYNC.pending = false; scheduleSync(); } }
}
function onSharedChange(){
  if (!currentUser){ if ($('#auth')) showAuth(); return; }
  const u = db.users.find(x=>x.id===currentUser.id); if (!u) return logout();
  currentUser = u;
  if (!cur() && db.projects.length) db.currentId = db.projects[0].id;
  if (imp || $('#modalRoot .overlay')) { toast('Dados atualizados por outro usuário no banco compartilhado.','',4000); renderProjSelect(); renderNav(); return; }
  go();
}
setInterval(async ()=>{ if (!SYNC.handle || !SYNC.ok || SYNC.busy) return; try { const f = await SYNC.handle.getFile(); if (f.lastModified !== SYNC.lastMod) syncNow(); } catch(e){ SYNC.err = e.message; renderSyncStatus(); } }, 15000);
async function connectShared(mode){
  if (!fsSupported()) return toast('Seu navegador não permite arquivos compartilhados. Use o Google Chrome ou o Microsoft Edge atualizados.','err',7000);
  try {
    let h;
    if (mode==='novo') h = await window.showSaveFilePicker({suggestedName:'banco_mensuracao_custos.json', types:[{description:'Banco de dados da mensuração', accept:{'application/json':['.json']}}]});
    else [h] = await window.showOpenFilePicker({types:[{description:'Banco de dados da mensuração', accept:{'application/json':['.json']}}]});
    SYNC.handle = h; SYNC.ok = true; SYNC.nome = h.name; await kv.set('sharedHandle', h);
    await syncNow();
    toast(mode==='novo' ? 'Banco compartilhado criado. Envie o mesmo arquivo (pasta compartilhada) para os demais usuários.' : 'Conectado ao banco compartilhado.','ok',6000);
    if (currentUser) go(); else showAuth();
  } catch(e){ if (e && e.name!=='AbortError') toast('Não foi possível conectar: '+e.message,'err',6000); }
}
async function reconnectShared(){
  if (!SYNC.handle) return connectShared('abrir');
  try { const r = await SYNC.handle.requestPermission({mode:'readwrite'}); SYNC.ok = r==='granted'; if (SYNC.ok){ await syncNow(); toast('Banco compartilhado reconectado.','ok'); if (currentUser) go(); else showAuth(); } else toast('Permissão negada para o arquivo compartilhado.','err'); }
  catch(e){ toast('Erro ao reconectar: '+e.message,'err'); }
}
async function disconnectShared(){
  SYNC.handle = null; SYNC.ok = false; SYNC.nome=''; try { await kv.del('sharedHandle'); } catch(e){}
  renderSyncStatus(); toast('Banco compartilhado desconectado. Os dados continuam salvos neste navegador.'); if (currentUser) go();
}
async function initShared(){
  try {
    const h = await kv.get('sharedHandle'); if (!h) return;
    SYNC.handle = h; SYNC.nome = h.name;
    const perm = await h.queryPermission({mode:'readwrite'});
    SYNC.ok = perm==='granted';
    if (SYNC.ok) await syncNow();
  } catch(e){ SYNC.err = e.message; }
  renderSyncStatus();
}
function renderSyncStatus(){
  const el = $('#syncSt'); if (!el) return;
  if (!SYNC.handle){ el.innerHTML = ''; el.className = 'sync-st'; return; }
  if (!SYNC.ok){ el.innerHTML = `<button class="btn sm" data-action="shared-reconnect" title="Reconectar ao banco compartilhado">${icon('importar')}Reconectar banco compartilhado</button>`; el.className = 'sync-st warn'; return; }
  el.className = 'sync-st ' + (SYNC.err ? 'err' : 'ok');
  el.innerHTML = SYNC.err ? `<span title="${esc(SYNC.err)}">⚠ Banco compartilhado: erro</span>` : `<span title="${esc(SYNC.nome)}">● ${SYNC.busy?'Sincronizando…':'Compartilhado'}${SYNC.last?' '+SYNC.last.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}</span>`;
}
function aprovTexto(p){ const ai = aprovInfo(p); return ai.n ? ai.list.filter(a=>a.reg).map(a=>`${a.nome} (${a.cargo}) em ${fmtDateTime(a.reg.em)}`).join('; ') + (ai.alterado?' — projeto alterado após a aprovação':'') : 'Pendente'; }

/* =====================================================================
   12. INICIALIZAÇÃO
   ===================================================================== */
loadDB();
applyTheme();
setLogos();
$$('[data-icon]').forEach(el=>{ el.outerHTML = icon(el.dataset.icon); });
(function(){
  const sid = getSession();
  const u = sid && db.users.find(x=>x.id===sid);
  if (u) startApp(u); else showAuth();
})();
initShared();
if (!storageOK) toast('O armazenamento local do navegador está bloqueado — os dados não serão mantidos ao fechar. Use Exportar JSON.','err',8000);
setTimeout(()=>{ loadLib('xlsx').catch(()=>{}); loadLib('autotable').catch(()=>{}); }, 1500);
</script>
