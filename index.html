<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensuração de Custos de Projetos</title>
<!--
  SISTEMA DE MENSURAÇÃO E GERENCIAMENTO DE CUSTOS DE PROJETOS
  Arquivo único (HTML + CSS + JavaScript). Abrir no Google Chrome ou Microsoft Edge.

  DEPENDÊNCIAS EXTERNAS (exigem conexão com a internet no primeiro uso; o navegador mantém em cache):
   - Chart.js 4.4.1 ............ gráficos do dashboard  (cdnjs.cloudflare.com)
   - SheetJS (xlsx) 0.18.5 ..... leitura de .xlsx/.xls  (cdnjs.cloudflare.com)
   - PDF.js 3.11.174 ........... leitura de PDF         (cdnjs.cloudflare.com)
   - Tesseract.js 5.1.1 ........ OCR de PDF digitalizado (cdn.jsdelivr.net + dados do idioma português)
   - jsPDF 2.5.1 + AutoTable 3.8.2 ... relatório em PDF (cdnjs.cloudflare.com)
  Funcionam SEM internet: cadastro, cálculos, filtros, projetos, importação de CSV, JSON e salvamento local.
  Os dados ficam salvos no próprio navegador (localStorage) — use "Exportar JSON" para backup.
  Perfis (nome, e-mail, senha): a senha é armazenada como hash SHA-256 com salt. Os perfis separam os projetos
  de cada pessoa NESTE navegador; não há servidor — não é um controle de acesso para dados sigilosos.
-->
<style>
:root{
  --card:#ffffff;--soft:#f5f7fa;--soft2:#eef0f3;--text2:#475467;--heading:#0f2747;--navy-solid:#0f2747;--side:#0f2747;color-scheme:light;
  --navy:#0f2747;--navy2:#173763;--navy3:#21487f;--blue:#1d4ed8;--blue-l:#e8eefc;
  --obra:#1e40af;--ativ:#0e7490;--serv:#b45309;
  --bg:#f1f3f7;--card:#ffffff;--line:#e2e6ee;--line2:#cfd6e2;--text:#1c2433;--muted:#667085;
  --danger:#b42318;--danger-l:#fdecea;--ok:#157f3b;--ok-l:#e7f6ec;--warn:#a15c07;--warn-l:#fff4e0;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* Sidebar */
.sidebar{background:var(--side);color:#dbe4f3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .t1{font-weight:700;font-size:15px;color:#fff;letter-spacing:.2px}
.brand .t2{font-size:11.5px;color:#9fb3d1;margin-top:2px}
.nav{padding:10px 8px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#c9d6ea;text-decoration:none;cursor:pointer;font-size:13.5px;margin-bottom:2px;user-select:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--navy3);color:#fff;font-weight:600}
.nav a .n{font-size:11px;opacity:.55;width:16px;text-align:right}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{padding:12px 16px;font-size:11.5px;color:#8ea3c4;border-top:1px solid rgba(255,255,255,.08)}
/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px;flex-wrap:wrap}
.topbar .proj{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.topbar .proj label{font-size:12px;color:var(--muted);white-space:nowrap}
.topbar select{max-width:360px}
.save-st{font-size:12px;color:var(--muted);white-space:nowrap}
.save-st.err{color:var(--danger)}
.menu-btn{display:none}
.content{padding:22px;max-width:1500px;width:100%}
h1.pg{font-size:21px;margin:0 0 4px;color:var(--heading)}
.pg-sub{color:var(--muted);margin:0 0 18px;font-size:13px}
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--heading)}
.card h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);border-top:4px solid var(--line2);min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:21px;font-weight:700;margin-top:6px;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.obra{border-top-color:var(--obra)}.kpi.ativ{border-top-color:var(--ativ)}.kpi.mat{border-top-color:#475569}.kpi.serv{border-top-color:var(--serv)}
.kpi.total{background:var(--navy-solid);border-color:var(--heading);border-top-color:#f2b84b}
.kpi.total .l{color:#b9c8e0}.kpi.total .v{color:#fff}.kpi.total .s{color:#b9c8e0}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .l{font-size:11.5px;color:var(--muted)}.stat .v{font-size:17px;font-weight:700;color:var(--heading)}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:18px}
.chart-box{position:relative;height:260px}
.chart-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--soft);border-color:#b8c2d3}
.btn svg{width:16px;height:16px}
.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.btn.primary:hover{background:#1a43bd}
.btn.navy{background:var(--navy-solid);border-color:var(--heading);color:#fff}.btn.navy:hover{background:var(--navy2)}
.btn.danger{color:var(--danger);border-color:#f0c4bf}.btn.danger:hover{background:var(--danger-l)}
.btn.danger.solid{background:#b42318;color:#fff;border-color:#b42318}
.btn.ok{background:#157f3b;border-color:#157f3b;color:#fff}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.icon{padding:5px 7px}
.btn.pdf{background:#b42318;border-color:#b42318;color:#fff;font-weight:700;letter-spacing:.2px}.btn.pdf:hover{background:#962015}
.btn.big{padding:11px 20px;font-size:14.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}.form-grid .span2{grid-column:span 2}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.fld label .req{color:var(--danger)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line2);border-radius:7px;padding:7px 10px;background:var(--card);outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.inp[readonly]{background:var(--soft);color:var(--text2);font-weight:600}
.inp.err{border-color:var(--danger);background:var(--danger-l)}
.fld .msg{font-size:11.5px;color:var(--danger);margin-top:3px;min-height:0}
textarea.inp{min-height:80px;resize:vertical}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.num{white-space:nowrap}
/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .inp{width:auto}
.toolbar .search{min-width:240px;flex:1;max-width:380px}
/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--soft);text-align:left;font-weight:600;color:var(--text2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;position:sticky;top:0}
.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{color:var(--blue)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--soft)}
.tbl tfoot td{background:var(--soft);font-weight:700;border-top:2px solid var(--line2)}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl .muted{color:var(--muted)}
.tbl tr.cur td{background:var(--blue-l)}
.tbl.compact td{padding:4px 5px}
.tbl.compact .inp{padding:4px 6px;font-size:12.5px;border-radius:5px;min-width:70px}
.tbl tr.invalid td{background:var(--danger-l)}
.tbl tr.unsel td{opacity:.55}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-obra{background:#e3e9fb;color:var(--obra)}.b-ativ{background:#dff3f7;color:var(--ativ)}.b-serv{background:#fdf0e1;color:var(--serv)}
.b-ok{background:var(--ok-l);color:var(--ok)}.b-err{background:var(--danger-l);color:var(--danger)}.b-warn{background:var(--warn-l);color:var(--warn)}.b-gray{background:var(--soft2);color:var(--text2)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.foot-sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.foot-sum b{color:var(--heading)}
.subt{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
/* Import */
.drop{border:2px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;background:var(--soft);transition:.15s}
.drop.over{border-color:var(--blue);background:var(--blue-l)}
.drop .big{font-size:15px;font-weight:600;color:var(--heading)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft2);color:#667085;font-weight:600}
.steps span.on{background:var(--navy-solid);color:#fff}.steps span.done{background:var(--ok-l);color:var(--ok)}
.progress{height:8px;background:var(--soft2);border-radius:99px;overflow:hidden;margin:10px 0}
.progress div{height:100%;background:var(--blue);width:0;transition:width .2s}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.alert.info{background:var(--blue-l);color:#1e3a8a}.alert.warn{background:var(--warn-l);color:var(--warn)}.alert.err{background:var(--danger-l);color:var(--danger)}.alert.ok{background:var(--ok-l);color:var(--ok)}
.map-tbl td{padding:6px 8px}
.wiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dup-cell{min-width:170px}
.dup-cell .lbl{font-size:11px;color:var(--warn);display:block;margin-bottom:2px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 14px;overflow-y:auto}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:760px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.sm{max-width:440px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mh h3{margin:0;font-size:16px;color:var(--heading)}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.calc-box{background:var(--blue-l);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.calc-box b{font-size:17px;color:var(--heading)}
/* Toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy-solid);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;max-width:380px;animation:tin .2s}
.toast.err{background:#b42318}.toast.ok{background:#157f3b}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.libs td:first-child{font-weight:600}
.hidden{display:none!important}
.mt8{margin-top:8px}.mt16{margin-top:16px}
.sum-tbl td.num,.sum-tbl th.num{width:160px}
.sum-tbl tr.tot td{background:var(--navy-solid);color:#fff;font-weight:700;font-size:14px}
.sum-tbl tr.sub td{font-weight:700;background:var(--soft)}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.charts{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .menu-btn{display:inline-flex}
  .kpis{grid-template-columns:1fr 1fr}.charts,.grid2,.subt{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr 1fr}
  .content{padding:14px}
  .topbar{padding:10px 14px}
}
@media (max-width:560px){.kpis,.form-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:auto}.stats{grid-template-columns:1fr 1fr}}

/* ---------- Prestadoras / downloads ---------- */
.modal.lg{max-width:1000px}
.tbl td .inp.cell{padding:4px 7px;font-size:12.5px;border-radius:6px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--soft);border:1px solid var(--line);padding:8px 10px;border-radius:8px;margin-bottom:12px;font-size:12.5px}
.dl-opts{display:grid;gap:10px}
.dl-group+.dl-group{margin-top:16px}
.dl-h{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.dl-opt{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line2);border-radius:10px;padding:14px 16px;cursor:pointer;background:var(--card);text-align:left;width:100%}
.dl-opt:hover{border-color:var(--blue);background:var(--blue-l)}
.dl-opt .ic{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.dl-opt b{display:block;font-size:14px;color:var(--heading)}.dl-opt span{font-size:12.5px;color:var(--muted)}
.dl-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.dl-cards{grid-template-columns:1fr}}
/* ---------- Etapas da mensuração ---------- */
.nav .grp{font-size:10.5px;letter-spacing:.6px;color:#7f93b5;padding:14px 12px 6px;font-weight:700;text-transform:uppercase}
.nav .grp b{display:block;color:#e3eaf6;font-size:12.5px;letter-spacing:0;text-transform:none;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a .st{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);color:#c9d6ea;flex:none}
.nav a .st.ok{background:#1f9d55;color:#fff}
.nav a.active .st{background:#4f7cf3;color:#fff}
.nav .sub-items a{padding-left:14px}
.stepper{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding:2px 2px 4px}
.stepper a{flex:1;min-width:132px;display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;text-decoration:none;color:var(--text);font-size:12.5px;font-weight:600;position:relative}
.stepper a:hover{border-color:var(--blue)}
.stepper a .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft2);color:var(--muted);font-size:12px;flex:none}
.stepper a.ok .n{background:#157f3b;color:#fff}
.stepper a.cur{border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,78,216,.18)}
.stepper a.cur .n{background:#1d4ed8;color:#fff}
.stepper a small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.etapa-nav{display:flex;justify-content:space-between;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.etapa-nav .btn{padding:9px 16px}
.base-mat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.base-mat .stat .v{font-size:16px}
@media (max-width:900px){.base-mat{grid-template-columns:1fr 1fr}}
/* ---------- Modo noturno ---------- */
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1322;--card:#121c2f;--soft:#172338;--soft2:#1e2b44;--line:#24324d;--line2:#33446a;
  --text:#e2e8f3;--text2:#b6c2d6;--muted:#8e9cb4;--heading:#eaf0fa;--navy-solid:#1f3c6e;--side:#08101e;--navy3:#1f3c6e;
  --blue:#4f7cf3;--blue-l:#17284a;--obra:#7d9ef6;--ativ:#3dbfd9;--serv:#f0a14d;
  --danger:#f2877d;--danger-l:#3a1b1d;--ok:#4cc47f;--ok-l:#11301f;--warn:#f1b65c;--warn-l:#37290f;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
[data-theme="dark"] .b-obra{background:rgba(125,158,246,.16)}[data-theme="dark"] .b-ativ{background:rgba(61,191,217,.15)}[data-theme="dark"] .b-serv{background:rgba(240,161,77,.15)}
[data-theme="dark"] .kpi.total{background:#1a3563;border-color:#24427a}
[data-theme="dark"] .btn:hover{border-color:#4a5d84}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.6)}
[data-theme="dark"] .sum-tbl tr.tot td{background:#1a3563}
[data-theme="dark"] .toast{background:#24427a}
[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
/* ---------- Logos, perfil, autenticação ---------- */
.brand-logos{display:inline-flex;align-items:center;gap:12px;margin-bottom:12px;background:#fff;padding:7px 11px;border-radius:8px}
.brand-logos img.i{height:16px}.brand-logos img.c{height:27px}
.logo-dark{display:none}[data-theme="dark"] .logo-light{display:none}[data-theme="dark"] .logo-dark{display:inline-block}
.user-chip{gap:8px;padding:4px 10px 4px 4px}
.avatar{width:28px;height:28px;border-radius:50%;background:#1d4ed8;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.user-chip .un{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.auth{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(15,39,71,.12);width:100%;max-width:440px;padding:28px 28px 22px}
.auth-logos{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.auth-logos .i{height:24px}.auth-logos .c{height:40px}
.auth h1{font-size:19px;margin:0;color:var(--heading);text-align:center}
.auth .sub{color:var(--muted);text-align:center;margin:4px 0 18px;font-size:13px}
.auth .fld{margin-bottom:12px}
.auth .btn.primary{width:100%;justify-content:center;padding:10px;font-size:14px;margin-top:4px}
.auth-err{min-height:18px;color:var(--danger);font-size:12.5px;margin:4px 0}
.auth-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:11.5px;color:var(--muted);gap:10px}
.tabs{display:flex;background:var(--soft2);border-radius:9px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;padding:8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--heading);box-shadow:var(--shadow)}
.tipo-opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fld label.tipo-opt,.tipo-opt{display:flex;color:var(--text);margin:0;align-items:center;gap:9px;border:1.5px solid var(--line2);border-radius:9px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13px;background:var(--card);user-select:none}
.tipo-opt:hover{border-color:var(--blue)}
.tipo-opt input{accent-color:#1d4ed8;margin:0}
.tipo-opt.on{border-color:var(--blue);background:var(--blue-l);color:var(--heading)}
.tipo-opt svg{flex:none;color:var(--blue)}
.b-tipo{background:var(--blue-l);color:var(--heading)}
@media (max-width:1100px){.tipo-opts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tipo-opts{grid-template-columns:1fr 1fr}.user-chip .un{display:none}}
.last-change{font-size:12px;color:var(--muted);margin:-6px 0 14px;padding:7px 12px;background:var(--soft2);border-radius:8px;border-left:3px solid var(--primary,#1e40af)}
.last-change a{cursor:pointer;color:inherit;text-decoration:underline}
.sync-st{font-size:12px;white-space:nowrap}.sync-st.ok{color:var(--ok)}.sync-st.err{color:var(--danger)}.sync-st.warn .btn{border-color:var(--warn);color:var(--warn)}
.auth-shared{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}.auth-shared .btns{margin-top:6px}
tr.unsel td{opacity:.5}
</style>

};
const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const libPromises = {};
const libStatus = {};
function loadLib(key){
  const L = LIBS[key];
  if (L.get()) { libStatus[key]='ok'; return Promise.resolve(L.get()); }
  if (libPromises[key]) return libPromises[key];
  const p = (L.dep ? loadLib(L.dep) : Promise.resolve()).then(()=> new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = L.url; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = ()=>{
      let tries = 0;
      (function wait(){
        const g = L.get();
        if (g) { libStatus[key]='ok'; resolve(g); }
        else if (++tries > 80) { libStatus[key]='erro'; reject(new Error('A biblioteca '+L.name+' foi baixada mas não inicializou.')); }
        else setTimeout(wait, 100);
      })();
    };
    s.onerror = ()=>{ libStatus[key]='erro'; delete libPromises[key]; s.remove();
      reject(new Error('Não foi possível carregar '+L.name+' ('+L.uso+'). Verifique a conexão com a internet.')); };
    document.head.appendChild(s);
  }));
  libPromises[key] = p;
  p.catch(()=>{ delete libPromises[key]; });
  return p;
}

/** Converte texto numérico (padrão brasileiro ou internacional) em número. Retorna null se inválido. */
function parseBR(v){
  if (v==null) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim();
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1,-1); }
  s = s.replace(/R\$|\s| | /gi,'');
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (s.endsWith('-')) { neg = !neg; s = s.slice(0,-1); }
  if (!/^[\d.,]+$/.test(s) || !/\d/.test(s)) return null;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc>-1 && ld>-1) {
    s = lc>ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if (lc>-1) {
    const parts = s.split(',');
    s = parts.length>2 ? s.replace(/,/g,'') : s.replace(',','.');
  } else if (ld>-1) {
    const parts = s.split('.');
    if (parts.length>2) s = s.replace(/\./g,'');
    else if (parts[1].length===3 && parts[0]!=='0' && parts[0]!=='') s = s.replace('.','');
  }
  const n = parseFloat(s);
  if (!isFinite(n)) return null;
  return neg ? -n : n;
}

function totals(p){
  const t = {obra:0, ativ:0, mat:0, serv:0, total:0, nObra:0, nAtiv:0, nMat:0, nServ:0, empresas:{}, servEmpresas:{}};
  if (!p) return t;
  for (const m of p.materiais){
    const v = round2(m.valorTotal);
    if (m.categoria==='ativacao'){ t.ativ += v; t.nAtiv++; } else { t.obra += v; t.nObra++; }
    const e = m.empresa || '(sem empresa)';
    const E = t.empresas[e] || (t.empresas[e] = {n:0, nObra:0, nAtiv:0, obra:0, ativ:0, total:0});
    E.n++; E.total += v;
    if (m.categoria==='ativacao'){ E.ativ += v; E.nAtiv++; } else { E.obra += v; E.nObra++; }
  }
  for (const s of p.servicos){
    const v = svcTotal(s); t.serv += v; t.nServ++;
    const e = s.empresa || '(sem empresa)';
    const E = t.servEmpresas[e] || (t.servEmpresas[e] = {n:0, total:0});
    E.n++; E.total += v;
  }
  t.obra = round2(t.obra); t.ativ = round2(t.ativ); t.serv = round2(t.serv);
  t.mat = round2(t.obra + t.ativ);
  t.total = round2(t.mat + t.serv);
  t.nMat = p.materiais.length;
  for (const k in t.empresas){ const E=t.empresas[k]; E.obra=round2(E.obra); E.ativ=round2(E.ativ); E.total=round2(E.total); }
  for (const k in t.servEmpresas){ t.servEmpresas[k].total = round2(t.servEmpresas[k].total); }
  return t;
}

function toast(msg, type, ms){
  const el = document.createElement('div');
  el.className = 'toast ' + (type||''); el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), ms||3200);
}
function openModal(html, opts){
  opts = opts||{};
  const root = $('#modalRoot');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${opts.size||''}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov && !opts.static) closeModal(ov); });
  root.appendChild(ov);
  const first = ov.querySelector('input:not([readonly]),select,textarea,button.primary');
  if (first) setTimeout(()=>first.focus(), 30);
  return ov;
}
function closeModal(ov){ (ov || $('#modalRoot .overlay:last-child'))?.remove(); }
function confirmDialog({title, message, okText, danger}){
  return new Promise(resolve=>{
    const ov = openModal(`<div class="mh"><h3>${esc(title||'Confirmação')}</h3></div>
      <div class="mb">${message}</div>
      <div class="mf"><button class="btn" data-r="0">Cancelar</button><button class="btn ${danger?'danger solid':'primary'}" data-r="1">${esc(okText||'Confirmar')}</button></div>`, {size:'sm', static:true});
    ov.addEventListener('click', e=>{ const b=e.target.closest('[data-r]'); if(!b) return; confirmDialog.checks = {}; ov.querySelectorAll('input[type=checkbox][id]').forEach(c=>{ confirmDialog.checks[c.id]=c.checked; }); confirmDialog.texts = {}; ov.querySelectorAll('textarea[id],input[id]:not([type=checkbox])').forEach(c=>{ confirmDialog.texts[c.id]=c.value.trim(); }); closeModal(ov); resolve(b.dataset.r==='1'); });
    ov.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(ov); resolve(false);} });
    setTimeout(()=>ov.querySelector('[data-r="1"]').focus(),30);
  });
}

const VIEWS = [

const ETAPAS = [['ident','Identificação'],['obra','Materiais de obra'],['ativacao','Materiais de ativação'],['servicos','Serviços e mão de obra'],['resumo','Resumo financeiro'],['relatorios','Relatórios'],['aprovacao','Aprovação']];
function etapaInfo(p, k){
  if (!p) return {ok:false, txt:''};
  const t = totals(p);
  switch(k){
    case 'ident': return {ok: !!(p.info.nome && p.info.tipo), txt: p.info.tipo ? tipoLabel(p.info.tipo) : 'Preencher dados'};
    case 'obra': return {ok: t.nObra>0, txt: t.nObra ? `${t.nObra} itens · ${fmtBRL(t.obra)}` : 'Pendente'};
    case 'ativacao': return {ok: t.nAtiv>0, txt: t.nAtiv ? `${t.nAtiv} itens · ${fmtBRL(t.ativ)}` : 'Pendente'};
    case 'servicos': return {ok: t.nServ>0, txt: t.nServ ? `${t.nServ} serviços · ${fmtBRL(t.serv)}` : (t.nMat ? 'Próxima etapa' : 'Após os materiais')};
    case 'resumo': return {ok: t.nMat>0 && t.nServ>0, txt: t.total ? fmtBRL(t.total) : 'Pendente'};
    case 'aprovacao': { const ai = aprovInfo(p); return {ok: ai.n===APROVADORES.length && !ai.alterado, txt: ai.n ? `${ai.n}/${APROVADORES.length} aprovações${ai.alterado?' · alterado após':''}` : 'Aguardando'}; }
    case 'relatorios': return {ok: !!p.ultimoRelatorio, txt: p.ultimoRelatorio ? 'Gerado em '+fmtDate(p.ultimoRelatorio.slice(0,10)) : 'Pendente'};
  }
  return {ok:false, txt:''};
}
function stepperHtml(curView){
  const p = cur(); if (!p) return '';
  return `<div class="stepper">${ETAPAS.map(([k,l],i)=>{ const e = etapaInfo(p,k); return `<a data-view="${k}" class="${e.ok?'ok':''} ${curView===k?'cur':''}" title="Etapa ${i+1}: ${l}"><span class="n">${e.ok && curView!==k ? '✓' : i+1}</span><div>${l}<small>${esc(e.txt)}</small></div></a>`; }).join('')}</div>`;
}
function etapaNavHtml(k){
  const i = ETAPAS.findIndex(e=>e[0]===k); if (i<0) return '';
  const prev = ETAPAS[i-1], next = ETAPAS[i+1];
  return `<div class="etapa-nav"><div>${prev?`<button class="btn" data-view="${prev[0]}">← Etapa ${i}: ${prev[1]}</button>`:''}</div><div>${next?`<button class="btn primary" data-view="${next[0]}">Próxima etapa ${i+2}: ${next[1]} →</button>`:''}</div></div>`;
}

function drawCharts(){
  const t = totals(cur());
  const boxes = ['ch1','ch2','ch3'];
  if (!window.Chart){
    boxes.forEach(b=>{ const m=$('#'+b+'m'); if(m){ m.textContent='Carregando gráficos…'; m.classList.remove('hidden'); } });
    loadLib('chart').then(()=>{ if(view==='dashboard') drawCharts(); })
      .catch(err=>{ boxes.forEach(b=>{ const m=$('#'+b+'m'); if(m){ m.textContent='Gráficos indisponíveis: '+err.message; m.classList.remove('hidden'); } }); });
    return;
  }
  charts.forEach(c=>{ try{c.destroy();}catch(e){} }); charts=[];
  const cs = getComputedStyle(document.documentElement);
  const dark = resolvedTheme()==='dark';
  if (Chart.defaults){ Chart.defaults.color = cs.getPropertyValue('--muted').trim() || '#667085'; Chart.defaults.borderColor = cs.getPropertyValue('--line').trim() || '#e2e6ee'; }
  const cardC = cs.getPropertyValue('--card').trim() || '#fff';
  const C = dark ? {obra:'#5b82f0', ativ:'#22a9c4', serv:'#e08d34', mat:'#8291ab'} : {obra:'#1e40af', ativ:'#0e7490', serv:'#b45309', mat:'#475569'};
  const moneyTip = tot => ({callbacks:{label:c=>`${c.label}: ${fmtBRL(c.raw)}${tot!=null?' ('+fmtPct(c.raw,tot)+')':''}`}});
  const empty = (id, cond)=>{ const m=$('#'+id+'m'); if(!m) return; m.classList.toggle('hidden', !cond); if(cond) m.textContent='Sem valores para exibir.'; };
  const base = {responsive:true, maintainAspectRatio:false, animation:{duration:300}};
  const c1=$('#ch1'), c2=$('#ch2'), c3=$('#ch3');
  if (!c1) return;
  charts.push(new Chart(c1,{type:'doughnut',data:{labels:['Materiais de obra','Materiais de ativação'],datasets:[{data:[t.obra,t.ativ],backgroundColor:[C.obra,C.ativ],borderColor:cardC,borderWidth:2}]},
    options:Object.assign({},base,{cutout:'58%',plugins:{legend:{position:'bottom'},tooltip:moneyTip(t.mat)}})}));
  empty('ch1', t.mat<=0);
  charts.push(new Chart(c2,{type:'bar',data:{labels:['Materiais de obra','Materiais de ativação','Total materiais','Serviços e mão de obra'],datasets:[{data:[t.obra,t.ativ,t.mat,t.serv],backgroundColor:[C.obra,C.ativ,C.mat,C.serv],borderRadius:5}]},
    options:Object.assign({},base,{plugins:{legend:{display:false},tooltip:moneyTip(null)},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtBRL(v).replace(',00','')}},x:{ticks:{font:{size:11}}}}})}));
  empty('ch2', t.total<=0);
  charts.push(new Chart(c3,{type:'pie',data:{labels:[`Obra (${fmtPct(t.obra,t.total)})`,`Ativação (${fmtPct(t.ativ,t.total)})`,`Serviços (${fmtPct(t.serv,t.total)})`],datasets:[{data:[t.obra,t.ativ,t.serv],backgroundColor:[C.obra,C.ativ,C.serv],borderColor:cardC,borderWidth:2}]},
    options:Object.assign({},base,{plugins:{legend:{position:'bottom'},tooltip:moneyTip(t.total)}})}));
  empty('ch3', t.total<=0);
}

      if (data && Array.isArray(data.projects)) list = data.projects;
      else if (data && data.project) list = [data.project];
      else if (data && data.info && (data.materiais || data.servicos)) list = [data];
      else throw new Error('Arquivo JSON não reconhecido como mensuração.');
      let n=0;
      const pmap = {};
      (Array.isArray(data.prestadoras)?data.prestadoras:[]).forEach(pr=>{
        const ex = myPrest().find(x=>norm(x.nome)===norm(pr.nome));
        if (ex) pmap[pr.id] = ex.id;
        else { const c = deepClone(pr); c.id = uid(); c.ownerId = currentUser.id; c.precos = (c.precos||[]).map(r=>Object.assign(r,{id:uid()})); db.prestadoras.push(c); pmap[pr.id] = c.id; }
      });
      for (const raw of list){
        const p = fixProject(deepClone(raw));
        p.ownerId = currentUser.id; p.criadoPor = p.criadoPor || {uid:currentUser.id, nome:currentUser.nome};
        logAlteracao(p, 'Projeto importado de arquivo JSON'); p.atualizadoEm = new Date().toISOString();
        p.servicos.forEach(sv=>{ sv.prestadoraId = pmap[sv.prestadoraId] || ((myPrest().find(x=>norm(x.nome)===norm(sv.empresa))||{}).id) || null; });
        if (db.projects.some(x=>x.id===p.id)) { p.id = uid(); p.info.nome = (p.info.nome||'Projeto') + ' (importado)'; }
        db.projects.push(p); n++;
        db.currentId = p.id;
      }
      saveDB(); go('projetos'); toast(n+' projeto(s) importado(s). Nenhum projeto existente foi alterado.','ok');
    } catch(err){ toast('Erro ao importar JSON: '+err.message,'err',6000); }
  });
};
function downloadBlob(content, filename, type){
  const blob = content instanceof Blob ? content : new Blob([content], {type:type||'application/octet-stream'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const fileSafe = s => norm(s).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,60) || 'projeto';

function filteredMats(){
  const p = cur(); const f = ui.mat; const q = norm(f.q);
  let list = p.materiais.filter(m=>
    (!q || norm(m.codigo).includes(q) || norm(m.nome).includes(q)) &&
    (!f.empresa || m.empresa===f.empresa) && (!f.categoria || m.categoria===f.categoria) && (!f.unidade || m.unidade===f.unidade));
  const key = f.sort;
  const val = m => key==='unit' ? unitValue(m) : m[key];
  list.sort((a,b)=>{
    const va=val(a), vb=val(b);
    const r = (typeof va==='number' && typeof vb==='number') ? va-vb : String(va||'').localeCompare(String(vb||''),'pt-BR',{numeric:true,sensitivity:'base'});
    return r * f.dir;
  });
  return list;
}

    ${list.map(m=>`<tr><td>${esc(m.empresa)}</td><td>${esc(m.codigo)||'<span class="muted">—</span>'}</td><td>${esc(m.nome)}${m.origem&&m.origem!=='Manual'?`<div class="muted" style="font-size:11px">${m.importId?'Importado: ':''}${esc(m.origem)}</div>`:''}</td>

    </tbody><tfoot><tr><td colspan="5">Subtotal dos itens exibidos (${list.length})</td><td></td><td></td><td class="num">${fmtBRL(sumT)}</td><td></td></tr></tfoot></table></div>`
    : `<div class="empty">${p.materiais.length ? 'Nenhum material corresponde aos filtros.' : 'Nenhum material cadastrado neste projeto.'}</div>`;
  $$('#matTable th[data-sort]').forEach(th=>th.addEventListener('click', ()=>{
    if (ui.mat.sort===th.dataset.sort) ui.mat.dir*=-1; else { ui.mat.sort=th.dataset.sort; ui.mat.dir=1; }
    $('#fSort').value = ui.mat.sort; $('#fDirL').textContent = ui.mat.dir>0?'Crescente':'Decrescente'; renderMatTable();

  $('#matSub').innerHTML = `<div class="card"><h2>Subtotais por empresa <span class="hint">itens exibidos</span></h2>

  if (db.settings.empresaPadrao) emps.add(db.settings.empresaPadrao);
  const units = new Set(db.settings.unidades||DEFAULT_UNITS); if(p) p.materiais.forEach(m=>units.add(m.unidade));
  return `<datalist id="dlEmp">${[...emps].sort().map(e=>`<option value="${esc(e)}">`).join('')}</datalist><datalist id="dlUn">${[...units].map(u=>`<option value="${esc(u)}">`).join('')}</datalist>`;
}

  const isNew = !m;
  m = m || {empresa:db.settings.empresaPadrao||'', codigo:'', nome:'', categoria:cat||'obra', unidade:'Unidade', quantidade:'', valorUnitario:''};
  const ov = openModal(`<div class="mh"><h3>${isNew?'Adicionar material':'Editar material'}</h3><button class="btn icon" data-x>${icon('x')}</button></div>
  <div class="mb">${datalists()}${catalogDatalist()}<div class="form-grid">
    <div class="fld span2"><label>Empresa de origem <span class="req">*</span></label><input class="inp" name="empresa" list="dlEmp" value="${esc(m.empresa)}" placeholder="Ex.: CLICK IP"><div class="msg"></div></div>
    <div class="fld"><label>Código do item</label><input class="inp" name="codigo" list="dlCatCod" value="${esc(m.codigo)}" placeholder="Ex.: 25"><div class="msg"></div></div>
    <div class="fld full"><label>Nome do item <span class="req">*</span></label><input class="inp" name="nome" list="dlCatDesc" value="${esc(m.nome)}" placeholder="Descrição completa do material (ou escolha do catálogo)"><div class="msg"></div><div class="muted" id="catHint" style="font-size:12px;margin-top:3px">Informe o código ou escolha a descrição: o catálogo de materiais preenche descrição, unidade e valor unitário.</div></div>
    <div class="fld"><label>Categoria <span class="req">*</span></label><select class="inp" name="categoria"><option value="obra" ${m.categoria!=='ativacao'?'selected':''}>Material de obra</option><option value="ativacao" ${m.categoria==='ativacao'?'selected':''}>Material de ativação</option></select><div class="msg"></div></div>
    <div class="fld"><label>Unidade de medida <span class="req">*</span></label><input class="inp" name="unidade" list="dlUn" value="${esc(m.unidade)}"><div class="msg"></div></div>
    <div class="fld"><label>Quantidade <span class="req">*</span></label><input class="inp num" name="quantidade" inputmode="decimal" value="${esc(fmtInput(m.quantidade,4))}" placeholder="0"><div class="msg"></div></div>
    <div class="fld"><label>Valor unitário (R$) <span class="req">*</span></label><input class="inp num" name="valorUnitario" inputmode="decimal" value="${esc(fmtInput(m.valorUnitario,4))}" placeholder="0,00"><div class="msg"></div></div>
    <div class="fld span2"><label>Valor total do item (calculado automaticamente)</label><div class="calc-box"><span>Quantidade × Valor unitário</span><b id="calcTotal">—</b></div></div>
  </div></div>
  <div class="mf">${isNew?'<button class="btn" data-save="again">Salvar e adicionar outro</button>':''}<button class="btn" data-x>Cancelar</button><button class="btn primary" data-save="1">Salvar material</button></div>`);
  const F = n => ov.querySelector(`[name="${n}"]`);
  const recalc = ()=>{ const q=parseBR(F('quantidade').value), v=parseBR(F('valorUnitario').value);
    $('#calcTotal', ov).textContent = (q>0 && v!=null && v>=0) ? fmtBRL(round2(q*v)) : (q===0 ? 'Quantidade não pode ser zero' : '—'); };
  ['quantidade','valorUnitario'].forEach(n=>F(n).addEventListener('input', recalc)); recalc();
  F('nome').addEventListener('change', ()=>{ if(isNew && cat==null){ F('categoria').value = autoCategory(F('nome').value, F('categoria').value); } });
  const fillCat = (it, from)=>{
    if (!it){ if (from==='codigo' && F('codigo').value.trim()) $('#catHint',ov).innerHTML = '<span class="badge b-warn">Código não encontrado no catálogo</span> preencha manualmente.'; return; }
    if (from==='codigo' && (isNew || !F('nome').value.trim())) F('nome').value = it.descricao;
    if (from==='nome' && !F('codigo').value.trim()) F('codigo').value = it.codigo;
    if (isNew || !F('unidade').value.trim()) F('unidade').value = it.unidade || F('unidade').value;
    if (isNew || parseBR(F('valorUnitario').value)==null) F('valorUnitario').value = fmtInput(it.valor,4);
    $('#catHint',ov).innerHTML = `<span class="badge b-ok">Catálogo</span> ${esc(it.codigo)} · ${esc(it.descricao)} · ${esc(it.unidade)} · <b>${fmtBRL(it.valor)}</b>${it.tabela?' (tabela '+esc(it.tabela)+')':''}`;
    recalc();
  };
  F('codigo').addEventListener('change', ()=>{ const c = F('codigo').value.trim(); if (c) fillCat(catalogFind(c), 'codigo'); });
  F('nome').addEventListener('change', ()=>{ const n = F('nome').value.trim(); if (n){ const it = catalogFind('', n); if (it) fillCat(it, 'nome'); } });
  ov.addEventListener('click', async e=>{
    if (e.target.closest('[data-x]')) return closeModal(ov);
    const sv = e.target.closest('[data-save]'); if(!sv) return;
    const data = {empresa:F('empresa').value.trim(), codigo:F('codigo').value.trim(), nome:F('nome').value.trim(), categoria:F('categoria').value, unidade:F('unidade').value.trim(), quantidade:parseBR(F('quantidade').value), valorUnitario:parseBR(F('valorUnitario').value)};
    const errs = validateMat(data);
    $$('.fld', ov).forEach(fl=>{ const i=fl.querySelector('[name]'); if(!i) return; const msg=errs[i.name]||''; i.classList.toggle('err',!!msg); const mm=fl.querySelector('.msg'); if(mm) mm.textContent=msg; });
    if (Object.keys(errs).length) return;
    const p = cur();
    const dup = findMatDup(data, p.materiais, isNew?null:m.id);
    if (dup){
      const ok = await confirmDialog({title:'Possível duplicidade', message:`Já existe um material da empresa <b>${esc(dup.empresa)}</b> com o mesmo código ou descrição:<br><br><b>${esc(dup.codigo||'')}</b> ${esc(dup.nome)} — ${fmtNum(dup.quantidade)} ${esc(dup.unidade)} · ${fmtBRL(dup.valorTotal)}<br><br>Deseja salvar mesmo assim como um registro separado?`, okText:'Salvar mesmo assim'});
      if (!ok) return;
    }
    data.valorTotal = round2(data.quantidade * data.valorUnitario);
    if (isNew){ p.materiais.push(Object.assign({id:uid(), origem:'Manual'}, data)); }
    else { Object.assign(p.materiais.find(x=>x.id===m.id), data); }
    touch(); toast(isNew?'Material adicionado.':'Material atualizado.','ok');
    closeModal(ov);
    go(data.categoria==='ativacao' && (view==='obra'||view==='ativacao') ? 'ativacao' : (view==='obra'||view==='ativacao' ? 'obra' : view));
    if (sv.dataset.save==='again') matForm(null, data.categoria);
  });
}
function validateMat(d){
  const e = {};
  if (!d.empresa) e.empresa = 'Informe a empresa de origem.';
  if (!d.nome) e.nome = 'Informe o nome do item.';
  if (!d.unidade) e.unidade = 'Informe a unidade.';
  if (d.categoria!=='obra' && d.categoria!=='ativacao') e.categoria = 'Selecione a categoria.';
  if (d.quantidade==null) e.quantidade = 'Informe uma quantidade numérica.';
  else if (d.quantidade<=0) e.quantidade = d.quantidade===0 ? 'A quantidade não pode ser zero.' : 'A quantidade não pode ser negativa.';
  if (d.valorUnitario==null) e.valorUnitario = 'Informe o valor unitário (pode ser 0,00).';
  else if (d.valorUnitario<0) e.valorUnitario = 'O valor não pode ser negativo.';
  return e;
}

function filteredSvcs(){
  const p = cur(); const q = norm(ui.svc.q);
  const list = p.servicos.filter(s=>(!q||norm(s.descricao).includes(q)) && (!ui.svc.empresa||s.empresa===ui.svc.empresa));
  const val = s => ui.svc.sort==='total' ? svcTotal(s) : s[ui.svc.sort];
  list.sort((a,b)=>{ const va=val(a), vb=val(b); return ((typeof va==='number')? va-vb : String(va).localeCompare(String(vb),'pt-BR',{numeric:true,sensitivity:'base'})) * ui.svc.dir; });
  return list;
}
function priceTag(s){
  const pr = prestById(s.prestadoraId);
  if (!pr) return '<span class="muted" title="Sem prestadora cadastrada">—</span>';
  const tp = tablePrice(pr, s.descricao);
  if (!tp) return '<span class="badge b-warn" title="Serviço não consta na tabela de preços da prestadora">Sem preço na tabela</span>';
  if (Math.abs(tp.valor - s.valorUnitario) < 0.005) return '<span class="badge b-ok">Conforme tabela</span>';
  return `<span class="badge b-gray" title="Valor editado manualmente">Tabela: ${fmtBRL(tp.valor)}</span>`;
}

    </tbody><tfoot><tr><td colspan="5">Total de serviços e mão de obra (${list.length} exibido(s))</td><td class="num">${fmtBRL(sum)}</td><td colspan="2"></td></tr></tfoot></table></div>`
    : `<div class="empty">${p.servicos.length?'Nenhum serviço corresponde aos filtros.':'Nenhum serviço cadastrado.'}<div class="btns mt8" style="justify-content:center"><button class="btn primary" data-action="svc-add">${icon('plus')}Adicionar serviço</button></div></div>`;

/* ---------- 7.6 Prestadoras e tabelas de preços ---------- */
function prestCompare(p){
  return myPrest().map(pr=>{
    let tot = 0, ok = 0; const miss = [];
    (p?p.servicos:[]).forEach(s=>{ const tp = tablePrice(pr, s.descricao); if (tp){ tot += round2(s.quantidade*tp.valor); ok++; } else miss.push(s.descricao); });
    return {pr, tot:round2(tot), ok, miss};
  });
}
function vPrestadoras(){
  const p = cur();
  const list = myPrest().slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const nSvc = p ? p.servicos.length : 0;
  const comp = prestCompare(p).filter(c=>c.ok>0).sort((a,b)=>(b.ok-a.ok)||(a.tot-b.tot));
  const full = comp.filter(c=>c.ok===nSvc); const best = full.length ? full.reduce((a,b)=>a.tot<=b.tot?a:b) : null;
  const atual = totals(p).serv;

/* ---------- Sugestão de serviços a partir dos materiais mensurados ---------- */
function suggestServices(p){
  const sug = {}; const ord = [];
  const add = (descricao, unidade, q, from)=>{ const k = norm(descricao); if (!sug[k]){ sug[k] = {descricao, unidade, quantidade:0, origem:[]}; ord.push(k); } sug[k].quantidade += q; if (!sug[k].origem.includes(from)) sug[k].origem.push(from); };
  for (const m of p.materiais){
    const n = ' '+normKey(m.nome+' '+(m.codigo||''))+' '; const u = normalizeUnit(m.unidade); const q = Number(m.quantidade)||0;
    const metros = u==='Metro' ? q : u==='Quilômetro' ? q*1000 : null;
    if (/ (cabo|fibra|fo|cordoalha) /.test(n) && metros!=null){ add(/ drop /.test(n) ? 'Lançamento de cabo drop' : 'Lançamento de fibra óptica', 'Metro', metros, m.nome); continue; }
    if (/ cto /.test(n) || n.includes('caixa de terminacao')){ add('Instalação de CTO','Unidade',q,m.nome); continue; }
    if (/ ceo /.test(n) || n.includes('caixa de emenda')){ add('Instalação de caixa de emenda','Unidade',q,m.nome); continue; }
    if (/ dio /.test(n) || n.includes('distribuidor interno')){ add('Instalação de DIO','Unidade',q,m.nome); continue; }
    if (/ splitter /.test(n)){ add('Instalação de splitter','Unidade',q,m.nome); continue; }
    if (/ (onu|ont) /.test(n)){ add('Ativação de cliente','Unidade',q,m.nome); continue; }
    if (/ (roteador|router) /.test(n)){ add('Configuração e ativação','Unidade',q,m.nome); continue; }
    if (/ poste /.test(n)){ add('Instalação de poste','Unidade',q,m.nome); continue; }
  }
  return ord.map(k=>sug[k]).filter(x=>x.quantidade>0);
}

    ['Responsável', p.info.responsavel||''],['Data de elaboração', fmtDate(p.info.data)],['Versão', p.info.versao||'1.0'],['Aprovação', aprovTexto(p)],['Última alteração', p.alteradoPor ? `${p.alteradoPor.nome} em ${fmtDateTime(p.atualizadoEm)}` : ''],['Gerado em', new Date().toLocaleString('pt-BR')+(currentUser?' por '+currentUser.nome:'')],[]];
}
/* Cada aba: {name, rows, widths, fmt:{c: formato} a partir de dataStart, formulas:[{r,c,f}]} */
async function downloadWorkbook(base, sheets){
  try {
    const X = await loadLib('xlsx');
    const wb = X.utils.book_new();
    for (const sh of sheets){
      const ws = X.utils.aoa_to_sheet(sh.rows);
      ws['!cols'] = (sh.widths||[]).map(w=>({wch:w}));
      const start = sh.dataStart||0;
      sh.rows.forEach((row, r)=>{ if (r<start || !row) return; row.forEach((v, c)=>{
        const cell = ws[X.utils.encode_cell({r, c})];
        if (cell && typeof v==='number' && sh.fmt && sh.fmt[c]) cell.z = sh.fmt[c];
      }); });
      (sh.formulas||[]).forEach(({r,c,f,z})=>{ const cell = ws[X.utils.encode_cell({r, c})]; if (cell){ cell.f = f; if (z) cell.z = z; } });
      X.utils.book_append_sheet(wb, ws, sh.name.slice(0,31));
    }
    X.writeFile(wb, base + '.xlsx');
    { const pp = cur(); if (pp){ pp.ultimoRelatorio = new Date().toISOString(); saveDB(); } }
    toast('Planilha baixada: '+base+'.xlsx','ok',4500);
  } catch(err){
    console.warn(err);
    const out = [];
    sheets.forEach((sh,i)=>{ if (sheets.length>1){ if (i) out.push([]); out.push(['### '+sh.name]); } out.push(...sh.rows); });
    const csv = '﻿' + out.map(r=>(r||[]).map(v=> typeof v==='number' ? fmtInput(v,4) : '"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    downloadBlob(csv, base + '.csv', 'text/csv;charset=utf-8');
    toast('Excel indisponível (sem internet). O arquivo foi baixado em CSV, que também abre no Excel.','',6500);
  }
}
const sortMat = list => list.slice().sort((a,b)=>(a.empresa||'').localeCompare(b.empresa||'','pt-BR')||(a.nome||'').localeCompare(b.nome||'','pt-BR'));
function xlMatSheet(p, cat, titulo){
  const rows = [[titulo],[],['Empresa de origem','Código','Descrição do material','Unidade','Quantidade','Valor unitário (R$)','Valor total (R$)']];
  const list = sortMat(p.materiais.filter(m=>m.categoria===cat));
  const first = rows.length;
  list.forEach(m=>rows.push([m.empresa, m.codigo, m.nome, m.unidade, m.quantidade, Math.round(unitValue(m)*10000)/10000, round2(m.valorTotal)]));
  const formulas = [];
  if (list.length){ rows.push(['Subtotal ('+list.length+' itens)','','','','','', round2(list.reduce((a,m)=>a+round2(m.valorTotal),0))]);
    formulas.push({r:rows.length-1, c:6, f:`SUM(G${first+1}:G${rows.length-1})`, z:XL_MONEY}); }
  else rows.push(['Nenhum item nesta categoria.']);
  return {name:titulo.replace(/^Relação de /i,'').replace(/^./,c=>c.toUpperCase()), rows, dataStart:first, widths:[24,14,50,12,12,18,18], fmt:{4:XL_QTY,5:XL_MONEY,6:XL_MONEY}, formulas};
}
function xlSvcSheet(p){
  const rows = [['Serviços e mão de obra'],[],['Descrição do serviço','Prestadora / equipe','Unidade','Quantidade','Valor unitário (R$)','Valor total (R$)']];
  const list = p.servicos.slice().sort((a,b)=>(a.empresa||'').localeCompare(b.empresa||'','pt-BR')||(a.descricao||'').localeCompare(b.descricao||'','pt-BR'));
  const first = rows.length; const formulas = [];
  list.forEach(s=>{ rows.push([s.descricao, s.empresa, s.unidade, s.quantidade, s.valorUnitario, svcTotal(s)]); const r = rows.length; formulas.push({r:r-1, c:5, f:`ROUND(D${r}*E${r},2)`, z:XL_MONEY}); });
  if (list.length){ rows.push(['Total de serviços ('+list.length+')','','','','', totals(p).serv]); formulas.push({r:rows.length-1, c:5, f:`SUM(F${first+1}:F${rows.length-1})`, z:XL_MONEY}); }

}
function xlResumoRows(t){
  const pc = (v,tot)=> tot>0 ? v/tot : 0;
  return [['RESUMO FINANCEIRO CONSOLIDADO'],['Descrição','Itens','Valor (R$)','% do total'],
    ['Subtotal de materiais de obra', t.nObra, t.obra, pc(t.obra,t.total)],
    ['Subtotal de materiais de ativação', t.nAtiv, t.ativ, pc(t.ativ,t.total)],
    ['Total geral de materiais', t.nMat, t.mat, pc(t.mat,t.total)],
    ['Subtotal de serviços e mão de obra', t.nServ, t.serv, pc(t.serv,t.total)],
    ['ESTIMATIVA TOTAL DE CUSTOS DO PROJETO', t.nMat+t.nServ, t.total, t.total>0?1:0]];
}
function xlEmpresaSheet(t){
  const rows = [['Custos de materiais por empresa de origem'],[],['Empresa de origem','Itens','Materiais de obra (R$)','Materiais de ativação (R$)','Subtotal (R$)','% dos materiais']];
  const first = rows.length; const ents = Object.entries(t.empresas).sort((a,b)=>b[1].total-a[1].total);
  ents.forEach(([k,E])=>rows.push([k, E.n, E.obra, E.ativ, E.total, t.mat>0?E.total/t.mat:0]));
  const formulas = [];
  if (ents.length){ rows.push(['Total', t.nMat, t.obra, t.ativ, t.mat, t.mat>0?1:0]); const r = rows.length-1;
    ['C','D','E'].forEach((L,i)=>formulas.push({r, c:2+i, f:`SUM(${L}${first+1}:${L}${r})`, z:XL_MONEY})); }
  else rows.push(['Nenhum material cadastrado.']);
  return {name:'Custos por empresa', rows, dataStart:first, widths:[32,8,22,24,18,16], fmt:{2:XL_MONEY,3:XL_MONEY,4:XL_MONEY,5:XL_PCT}, formulas};
}
function xlPrestSheet(t){
  const rows = [['Custos de serviços por prestadora / equipe'],[],['Prestadora / equipe','Serviços','Subtotal (R$)','% dos serviços']];
  const first = rows.length; const ents = Object.entries(t.servEmpresas).sort((a,b)=>b[1].total-a[1].total);
  ents.forEach(([k,E])=>rows.push([k, E.n, E.total, t.serv>0?E.total/t.serv:0]));
  const formulas = [];
  if (ents.length){ rows.push(['Total', t.nServ, t.serv, t.serv>0?1:0]); const r = rows.length-1; formulas.push({r, c:2, f:`SUM(C${first+1}:C${r})`, z:XL_MONEY}); }
  else rows.push(['Nenhum serviço cadastrado.']);
  return {name:'Custos por prestadora', rows, dataStart:first, widths:[34,10,18,16], fmt:{2:XL_MONEY,3:XL_PCT}, formulas};
}

function autoMapRow(row, tipo){
  const allowed = new Set(fieldsFor(tipo).map(f=>f[0]));
  const cands = [];
  (row||[]).forEach((cell,ci)=>{
    const h = normKey(cell); if(!h || h.length>60) return;
    for (const f in SYN){ if(!allowed.has(f)) continue;
      SYN[f].forEach((s,i)=>{ let base=0;
        if (h===s) base=3; else if (h.startsWith(s+' ')||h.endsWith(' '+s)) base=2; else if ((' '+h+' ').includes(' '+s+' ')) base=1;
        if (base) cands.push({ci, f, sc:base*100-i});
      });
    }
  });
  cands.sort((a,b)=>b.sc-a.sc);
  const mapping = {}, usedC = new Set();
  for (const c of cands){ if (mapping[c.f]!=null || usedC.has(c.ci)) continue; mapping[c.f]=c.ci; usedC.add(c.ci); }
  return mapping;
}
const combineRows = (a,b)=>{ const n = Math.max((a||[]).length,(b||[]).length); const o=[]; let lastA='';
  for (let i=0;i<n;i++){ let x = String((a||[])[i]==null?'':(a||[])[i]).trim(); const y = String((b||[])[i]==null?'':(b||[])[i]).trim();
    if (!x && y && lastA && /valor|preco|vlr|custo/i.test(lastA)) x = lastA;   // célula mesclada ("Valor" sobre "Unit." e "Total")
    if (x) lastA = x; o.push((x+' '+y).trim()); } return o; };
function detectHeader(table, tipo){
  let best = null;
  const lim = Math.min(table.length, 45);
  const ok = m => m.nome!=null || m.quantidade!=null;
  for (let r=0; r<lim; r++){
    const m = autoMapRow(table[r], tipo); const n = Object.keys(m).length;
    if (n>=2 && ok(m) && (!best || n>best.n)) best = {row:r, mapping:m, n, span:1};
    if (r+1<table.length){
      const comb = combineRows(table[r], table[r+1]);
      const m2 = autoMapRow(comb, tipo); const n2 = Object.keys(m2).length;
      const nNext = Object.keys(autoMapRow(table[r+1], tipo)).length;
      if (n2>=3 && ok(m2) && n2>n && n2>nNext && (!best || n2>best.n)) best = {row:r, mapping:m2, n:n2, span:2, comb};
    }
  }
  return best;
}
const TOTAL_LINE = /^(sub ?total|total|valor total|total geral|soma|pagina|página|observa|obs|valor global|preco global)\b/;
const SVC_START = ['lancamento','instalacao','fusao','fusoes','configuracao','ativacao de','ativacao do','ativacao da','mao de obra','servico','servicos','execucao','montagem','vistoria','certificacao','manutencao','remocao','retirada','desmontagem','passagem de','emenda','teste','testes','organizacao','adequacao','acompanhamento','deslocamento','diaria','diarias','hora tecnica','mobilizacao','desmobilizacao','levantamento','cadastro','elaboracao','projeto executivo','limpeza','substituicao','construcao','escavacao','abertura de','recomposicao','lancar','instalar','fusionar','tecnico','equipe'];
function looksService(nome, unidade){
  const n = normKey(nome);
  if (SVC_START.some(w=>n===w || n.startsWith(w+' '))) return true;
  return ['Hora','Diária','Serviço','Verba'].includes(normalizeUnit(unidade));
}
function sectionOf(text){
  const n = normKey(text); if (!n || n.length>90) return null;
  if (/\b(servicos?|mao de obra|m o|instalacao e servicos)\b/.test(n)) return 'servico';
  if (/\bativac/.test(n) || /^solucao$/.test(n)) return 'ativacao';
  if (/\b(materia(l|is) de obra|obra|obras|infraestrutura|infra estrutura|rede externa|construcao|rede optica)\b/.test(n)) return 'obra';
  return null;
}
function classFromValue(v){
  const n = norm(v); if (!n) return null;
  if (/serv|mao de obra|^m\.?o\.?$/.test(n)) return 'servico';
  if (n.includes('ativ')) return 'ativacao';
  if (/obra|infra|rede/.test(n)) return 'obra';
  return null;
}
const isAllCaps = s => /[A-ZÀ-Ú]{3,}/.test(s) && s===s.toUpperCase();
function classify(d, cfg, secao){
  const col = classFromValue(d.categoria);
  const matCat = ()=> (!cfg.categoria || cfg.categoria==='auto') ? autoCategory(d.nome+' '+(d.codigo||''), 'obra') : cfg.categoria;
  if (cfg.tipo==='servicos') return 'servico';
  if (cfg.tipo==='materiais'){ if (col && col!=='servico') return col; if (secao && secao!=='servico') return secao; return matCat(); }
  if (col) return col;
  if (secao) return secao;
  if (looksService(d.nome, d.unidade)) return 'servico';
  return matCat();
}
function makeRow(d, cfg, secao){
  let q = d.quantidade, vu = d.valorUnitario, vt = d.valorTotal;
  let aviso = '';
  if (q==null && (vt!=null || vu!=null)){ q = 1; aviso = 'Quantidade não informada no arquivo — considerada 1'; if (vu==null) vu = vt; }
  if (vt==null && vu!=null && q!=null) vt = round2(q*vu);
  if (vu==null && vt!=null && q) vu = vt/q;
  if (!aviso && q!=null && vu!=null && vt!=null && q>0){
    const calc = round2(q*vu);
    if (Math.abs(calc-vt) > Math.max(0.05, Math.abs(vt)*0.01)) aviso = `Total do arquivo (${fmtBRL(vt)}) difere de Qtd × Unit. (${fmtBRL(calc)}) — confira o valor unitário`;
    vt = calc;
  }
  const categoria = classify(d, cfg, secao);
  return { sel:true, empresa: String(d.empresa||'').trim() || cfg.empresa || '', codigo:String(d.codigo||'').trim(), nome:String(d.nome||'').replace(/\s+/g,' ').trim(), categoria,
    unidade: normalizeUnit(d.unidade) || (categoria==='servico'?'Serviço':'Unidade'),
    quantidade: q, valorUnitario: vu==null?0:vu, valorTotal: vt==null?0:round2(vt), aviso, dup:null, dupAction:'ignorar', secao:secao||'' };
}
function rowsFromMapping(table, headerRow, mapping, cfg, opts){
  opts = opts || {};
  const out = []; let secao = null, last = null; const stats = {titulos:0, continuacoes:0, cabecalhos:0, secoes:0};
  const g = (r,f)=> mapping[f]!=null && mapping[f]!=='' ? r[mapping[f]] : '';
  const nMap = Object.keys(mapping).filter(k=>mapping[k]!=null).length;
  for (let i=headerRow+1; i<table.length; i++){
    const r = table[i]; if (!r) continue;
    const cells = r.map(c=>String(c==null?'':c).trim()).filter(Boolean);
    if (!cells.length) continue;
    if (cells.length>=2 && Object.keys(autoMapRow(r, cfg.tipo)).length >= Math.min(3, nMap)){ stats.cabecalhos++; last=null; continue; }   // cabeçalho repetido (nova página)
    const nome = String(g(r,'nome')).replace(/\s+/g,' ').trim();
    const codigo = String(g(r,'codigo')).trim();
    const q = parseBR(g(r,'quantidade')), vu = parseBR(g(r,'valorUnitario')), vt = parseBR(g(r,'valorTotal'));
    const hasNum = q!=null || vu!=null || vt!=null;
    if (!hasNum){
      const txt = cells.join(' ');
      const sec = cells.length<=2 ? sectionOf(txt) : null;
      if (sec){ secao = sec; last = null; stats.secoes++; continue; }
      if (opts.continuation && last && nome && !codigo && cells.length===1 && cells[0]===nome && !isAllCaps(nome) && !TOTAL_LINE.test(norm(nome))){ last.nome = (last.nome+' '+nome).replace(/\s+/g,' '); stats.continuacoes++; continue; }
      if (!(codigo && nome)){ stats.titulos++; last = null; continue; }
    }
    if (!nome && !codigo) continue;
    if (TOTAL_LINE.test(norm(nome)) && !codigo) { last=null; continue; }
    if ((TOTAL_LINE.test(norm(codigo)) || TOTAL_LINE.test(norm(nome))) && (q==null || !/[a-zA-ZÀ-ú]{3,}/.test(nome))) { last=null; continue; }
    if (!/[a-zA-ZÀ-ú0-9]/.test(nome) && q==null) continue;
    last = makeRow({nome, codigo, empresa:g(r,'empresa'), categoria:g(r,'categoria'), unidade:g(r,'unidade'), quantidade:q, valorUnitario:vu, valorTotal:vt}, cfg, secao);
    out.push(last);
  }
  out.stats = stats;
  return out;
}

/* Leitura de linhas de texto (PDF/OCR) sem cabeçalho reconhecível */
function parseLinesHeuristic(lines, cfg){
  const out = []; let secao = null, last = null; const stats = {titulos:0, continuacoes:0, cabecalhos:0, secoes:0};
  for (let raw of lines){
    const line = String(raw).replace(/\s+/g,' ').trim();
    if (line.length<3 || !/[a-zA-ZÀ-ú]/.test(line)) continue;
    const tk = line.split(' ');
    const nums = []; let unit = ''; let i = tk.length-1;
    for (; i>=0; i--){
      const t = tk[i];
      if (/^r\$$/i.test(t)) continue;
      const n = /^[-(]?(R\$)?[\d.,]+\)?$/i.test(t) ? parseBR(t) : null;
      if (n!=null && nums.length<3){ nums.unshift({n, money:/,\d{2}$/.test(t)||/R\$/i.test(t)}); continue; }
      if (!unit && isUnitToken(t) && nums.length>0 && nums.length<3){ unit = t; continue; }
      if (!unit && isUnitToken(t) && nums.length===3 && i>0){ unit = t; i--; }
      break;
    }
    if (!nums.length){
      const sec = sectionOf(line);
      if (sec && line.length<70){ secao = sec; last = null; stats.secoes++; continue; }
      if (last && /^[a-zà-ú(\/-]/.test(line) && line.length<90){ last.nome = (last.nome+' '+line).replace(/\s+/g,' '); stats.continuacoes++; continue; }
      stats.titulos++; last = null; continue;
    }
    let head = tk.slice(0, i+1);
    if (head.length && /^\d{1,3}[.)]?$/.test(head[0]) && head.length>1) head = head.slice(1);           // nº do item
    let codigo = '';
    if (head.length>1 && /\d/.test(head[0]) && /^[A-Za-z0-9][A-Za-z0-9\-_.\/]{2,}$/.test(head[0]) && !isUnitToken(head[0])) { codigo = head[0]; head = head.slice(1); }
    const nome = head.join(' ').replace(/^[-–:|]+|[-–:|]+$/g,'').trim();
    if (nome.length<3 || !/[a-zA-ZÀ-ú]{2,}/.test(nome)) { last=null; continue; }
    if (TOTAL_LINE.test(norm(nome))) { last=null; continue; }
    if (Object.keys(autoMapRow(nome.split(/\s+/), cfg.tipo)).length>=3) { stats.cabecalhos++; last=null; continue; }   // linha de cabeçalho
    let q=null, vu=null, vt=null;
    if (nums.length===1 && !unit){
      if (nums[0].money && (cfg.tipo==='servicos' || looksService(nome,''))) { vt = nums[0].n; }   // serviço por preço global
      else { stats.titulos++; last=null; continue; }
    }
    else if (nums.length===3){ q=nums[0].n; vu=nums[1].n; vt=nums[2].n; }
    else if (nums.length===2){ q=nums[0].n; vu=nums[1].n; }
    else q = nums[0].n;
    last = makeRow({nome, codigo, unidade:unit, quantidade:q, valorUnitario:vu, valorTotal:vt}, cfg, secao);
    out.push(last);
  }
  out.stats = stats;
  return out;
}

/* CSV próprio (detecta ; , ou TAB, aspas e codificação) */
function decodeText(buf){
  try { return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const sample = text.split(/\r?\n/).filter(l=>l.trim()).slice(0,12).join('\n');
  const count = ch => { let n=0, q=false; for (const c of sample){ if(c==='"') q=!q; else if(c===ch && !q) n++; } return n; };
  const cands = [[';',count(';')],['\t',count('\t')],[',',count(',')]].sort((a,b)=>b[1]-a[1]);
  const sep = cands[0][1]>0 ? cands[0][0] : ';';
  const rows = []; let row = [], fld = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ fld+='"'; i++; } else q=false; } else fld+=c; }
    else if (c==='"') q = true;
    else if (c===sep){ row.push(fld); fld=''; }
    else if (c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(fld); rows.push(row); row=[]; fld=''; }
    else fld += c;
  }
  if (fld!=='' || row.length){ row.push(fld); rows.push(row); }
  return rows.map(r=>r.map(c=>c.replace(/\s+/g,' ').trim()));
}

/* PDF -> linhas com posição das células (camada de texto) ou texto (OCR) */
function textItemsToLines(items){
  const its = items.filter(it=>it.str && it.str.trim()!=='').map(it=>({s:it.str, x:it.transform[4], y:it.transform[5], w:it.width||0, h:Math.abs(it.transform[3])||it.height||10}));
  its.sort((a,b)=> (b.y-a.y) || (a.x-b.x));
  const lines = [];
  for (const it of its){
    const L = lines.find(l=>Math.abs(l.y-it.y) <= Math.max(2, Math.min(l.h,it.h)*0.45));
    if (L) { L.items.push(it); } else lines.push({y:it.y, h:it.h, items:[it]});
  }
  lines.sort((a,b)=>b.y-a.y);
  return lines.map(L=>{
    L.items.sort((a,b)=>a.x-b.x);
    const cells = []; let cur = null;
    for (const it of L.items){
      const gap = cur ? it.x - cur.x1 : 0;
      if (!cur || gap > it.h*0.9){ cur = {t:it.s, x0:it.x, x1:it.x+it.w}; cells.push(cur); }
      else { cur.t += (gap > it.h*0.12 ? ' ' : '') + it.s; cur.x1 = Math.max(cur.x1, it.x+it.w); }
    }
    cells.forEach(c=>c.t = c.t.replace(/\s+/g,' ').trim());
    return {cells: cells.filter(c=>c.t), text: cells.map(c=>c.t).join('   ')};
  }).filter(l=>l.cells.length);
}
/* Alinha as células de cada linha às colunas do cabeçalho pela posição horizontal */
function alignByHeader(struct, hr){
  const H = struct[hr].cells; const pad = 6;
  const starts = H.map(c=>c.x0 - pad);
  return struct.map((L, li)=>{
    if (li===hr) return H.map(c=>c.t);
    const arr = new Array(H.length).fill('');
    for (const c of L.cells){
      const isNum = parseBR(c.t)!=null;
      const pt = isNum ? c.x1 - 0.5 : c.x0 + 0.5;
      let j = 0; for (let k=0;k<starts.length;k++){ if (pt >= starts[k]) j = k; }
      arr[j] = arr[j] ? arr[j]+' '+c.t : c.t;
    }
    return arr;
  });
}
async function ocrSources(sources, onProg){
  const T = await loadLib('tesseract');
  onProg('Carregando OCR (idioma: '+db.settings.ocrLang+')…', 0);
  const worker = await T.createWorker(db.settings.ocrLang||'por', 1, { logger: m=>{ if (m.status==='recognizing text') onProg(null, m.progress); } });
  try {
    await worker.setParameters({ preserve_interword_spaces:'1' });
    const out = [];
    for (let i=0;i<sources.length;i++){
      onProg(`Reconhecendo texto (OCR) — página ${i+1} de ${sources.length}…`, 0);
      const { data } = await worker.recognize(await sources[i]());
      out.push(...String(data.text||'').split(/\r?\n/));
    }
    return out;
  } finally { try{ await worker.terminate(); }catch(e){} }
}
async function extractPdf(file, cfg, onProg){
  const pdfjs = await loadLib('pdfjs');
  if (pdfjs.GlobalWorkerOptions && !pdfjs.GlobalWorkerOptions.workerSrc) pdfjs.GlobalWorkerOptions.workerSrc = PDF_WORKER;
  const pdf = await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines = []; const struct = []; const ocrPages = [];
  for (let n=1; n<=pdf.numPages; n++){
    onProg(`Lendo página ${n} de ${pdf.numPages}…`, n/pdf.numPages);
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const chars = tc.items.map(i=>i.str||'').join('').replace(/\s/g,'').length;
    if (cfg.forceOcr || chars < 25){
      ocrPages.push(n);
      const pl = await ocrSources([async ()=>{ const vp = page.getViewport({scale:2.2}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
        await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise; return cv; }], onProg);
      lines.push(...pl);
    } else { const ls = textItemsToLines(tc.items); struct.push(...ls); lines.push(...ls.map(l=>l.text)); }
  }
  return {lines, struct: ocrPages.length ? null : struct, ocrPages, numPages:pdf.numPages};
}

      valor += d.valorTotal;
      if (r.dup && r.dupAction==='atualizar'){ const ex = p.materiais.find(m=>m.id===r.dup); if (ex){ atualizados.push({tipo:'material', id:ex.id, antes:deepClone(ex)}); Object.assign(ex, d, {codigo:d.codigo||ex.codigo, origem}); updated++; continue; } }
      const id = uid(); p.materiais.push(Object.assign({id, origem, importId:histId}, d)); itens.materiais.push(id); added++;
    }
  }
  const status = (added+updated)===imp.rows.length ? 'Concluída' : (added+updated)>0 ? 'Concluída (parcial)' : 'Concluída sem itens';
  const tipo = nM && nS ? 'misto' : nS ? 'servicos' : 'materiais';
  const det = [`${added} novo(s)`, updated?`${updated} atualizado(s)`:'', ign?`${ign} duplicado(s) ignorado(s)`:'', (imp.rows.length-sel.length)?`${imp.rows.length-sel.length} não selecionado(s)`:''].filter(Boolean).join(', ') + ' · ' + fmtBRL(valor);
  logImport(status, added+updated, det, {id:histId, itens, atualizados, tipo, valor:round2(valor)});
  toast(`${added+updated} item(ns) importado(s) de ${imp.file.name}${imp.sheet?' ('+imp.sheet+')':''}.`,'ok');
  nextFile();
}
/* Exclui do projeto os itens adicionados por uma importação e restaura os registros atualizados por ela */
function undoImport(id, silent, restore){
  const p = cur(); const h = p.importacoes.find(x=>x.id===id); if (!h) return {mats:0, svcs:0, rest:0};
  const it = histItems(p, h);
  const mIds = new Set(it.mats.map(m=>m.id)), sIds = new Set(it.svcs.map(s=>s.id));
  p.materiais = p.materiais.filter(m=>!mIds.has(m.id));
  p.servicos = p.servicos.filter(s=>!sIds.has(s.id));
  let rest = 0;
  if (restore!==false) (h.atualizados||[]).forEach(u=>{
    const list = u.tipo==='servico' ? p.servicos : p.materiais;
    const ex = list.find(x=>x.id===u.id);
    const antes = deepClone(u.antes);
    if (u.tipo!=='servico'){ const q = Number(antes.quantidade)||0; if (antes.valorUnitario==null) antes.valorUnitario = q>0 ? (Number(antes.valorTotal)||0)/q : 0; antes.valorTotal = round2(q*antes.valorUnitario); }
    if (ex) Object.assign(ex, antes); else list.push(antes);
    rest++;
  });
  h.desfeita = new Date().toISOString(); h.status = 'Excluída';
  h.detalhes = (h.detalhes||'') + ` · Excluída em ${fmtDateTime(h.desfeita)} (${[mIds.size?mIds.size+' mat.':'', sIds.size?sIds.size+' serv.':''].filter(Boolean).join(' e ')||'nenhum item'} removido(s)${rest?`, ${rest} restaurado(s)`:''})`;
  return {mats:mIds.size, svcs:sIds.size, rest};
}
async function askUndoImport(id){
  const p = cur(); const h = p.importacoes.find(x=>x.id===id); if (!h) return;
  const it = histItems(p, h);
  const val = round2(it.mats.reduce((a,m)=>a+round2(m.valorTotal),0) + it.svcs.reduce((a,s)=>a+svcTotal(s),0));
  const nu = (h.atualizados||[]).length;
  const ok = await confirmDialog({title:'Excluir importação', message:`<b>${esc(h.arquivo)}</b> <span class="muted">(${esc(h.formato)}, importado em ${fmtDateTime(h.data)})</span><br><br>
    Serão excluídos do projeto: <b>${it.mats.length}</b> material(is) e <b>${it.svcs.length}</b> serviço(s), somando <b>${fmtBRL(val)}</b>.
    ${it.mats.length+it.svcs.length ? '<br><span class="muted" style="font-size:12px">Itens editados depois da importação também serão excluídos.</span>':''}
    ${nu?`<br><br><label><input type="checkbox" id="undoRestore" checked> Restaurar os ${nu} registro(s) existentes que esta importação atualizou para os valores anteriores</label>`:''}
    ${it.legacy?'<div class="alert warn mt8" style="margin-bottom:0">Importação feita em versão anterior do sistema: serão excluídos os itens cuja origem é este arquivo.</div>':''}`, okText:'Excluir importação', danger:true});
  if (!ok) return;
  const restore = nu ? !!(confirmDialog.checks||{}).undoRestore : false;
  const r = undoImport(id, false, restore);
  touch(); go('importar');
  toast(`Importação excluída: ${r.mats} material(is) e ${r.svcs} serviço(s) removidos${r.rest?`, ${r.rest} restaurado(s)`:''}.`,'ok',5000);
}
function wizDone(){
  const t = totals(cur());
  const tot = imp.resumo.reduce((a,r)=>a+r.importados,0);
  const canUndo = imp.resumo.some(r=>r.histId && r.importados>0);

    let itemN = 0;

    // Serviços
    const sv = p.servicos.slice().sort((a,b)=>(a.empresa||'').localeCompare(b.empresa||'','pt-BR')||(a.descricao||'').localeCompare(b.descricao||'','pt-BR'));

    const fname = `${MD.arquivo}${p.info.codigo?fileSafe(p.info.codigo)+'_':''}${fileSafe(p.info.nome)}.pdf`;
    doc.save(fname);
    p.ultimoRelatorio = new Date().toISOString(); saveDB();
    toast('PDF gerado: '+fname,'ok',4500);
  } catch(err){ console.error(err); toast('Erro ao gerar o PDF: '+err.message,'err',7000); }
}

const SESSION_KEY = 'mensuracaoCustos.session';
const initials = n => String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase() || '?';
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function getSession(){
  try { return sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY); } catch(e){ return null; }
}
function setSession(id, remember){
  try { sessionStorage.setItem(SESSION_KEY, id); if (remember) localStorage.setItem(SESSION_KEY, id); else localStorage.removeItem(SESSION_KEY); } catch(e){}
}
function clearSession(){ try { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); } catch(e){} }

      const nome = fc.nome.value.trim().replace(/\s+/g,' '), email = fc.email.value.trim().toLowerCase(), s1 = fc.senha.value, s2 = fc.senha2.value;
      if (nome.length<2) return err('Informe seu nome.');
      if (!validEmail(email)) return err('Informe um e-mail válido.');
      if (db.users.some(x=>norm(x.email)===norm(email))) return err('Já existe um perfil com este e-mail. Use "Entrar".');
      if (s1.length<6) return err('A senha deve ter pelo menos 6 caracteres.');
      if (s1!==s2) return err('As senhas não conferem.');
      const salt = newSalt();
      const u = {id:uid(), nome, email, salt, hash:hashPwd(s1, salt), criadoEm:new Date().toISOString()};
      const wasFirst = !db.users.length;
      db.users.push(u);
      if (wasFirst) db.projects.forEach(p=>{ if(!p.ownerId) p.ownerId = u.id; if(!p.criadoPor) p.criadoPor = {uid:u.id, nome:u.nome}; });
      setSession(u.id, fc.lembrar.checked);
      startApp(u);
      toast('Perfil criado. Bem-vindo(a), '+nome.split(' ')[0]+'!','ok');
    };
  }
}
function startApp(u){
  currentUser = u;
  const a = $('#auth'); if (a) a.remove();

  db.currentByUser = db.currentByUser || {};

  if (!myProjects().length){ const np = newProject(); db.projects.push(np); db.currentId = np.id; }
  if (!cur()) db.currentId = myProjects()[0].id;
  u.ultimoAcesso = new Date().toISOString();
  saveDB(); renderUser(); renderSyncStatus(); view = 'dashboard'; go('dashboard');
}

}

      if (hashPwd(atual, u.salt)!==u.hash) errs.atual = 'Senha atual incorreta.';

  });

function catalogFind(codigo, descricao){
  const cat = catalogo(); const pref = db.settings.catalogoTabela || '';

  if (!list.length && descricao){ const n = norm(descricao); list = cat.filter(x=>norm(x.descricao)===n); }

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
async function importCatalog(file){
  try {
    const ext = extOf(file.name); let sheets = [];
    if (ext==='csv') sheets = [{name: file.name.replace(/\.[^.]+$/,''), rows: parseCSV(decodeText(await file.arrayBuffer()))}];
    else { const X = await loadLib('xlsx'); const wb = X.read(new Uint8Array(await file.arrayBuffer()), {type:'array'}); sheets = wb.SheetNames.map(n=>({name:n, rows:sheetRows(wb.Sheets[n])})); }
    const res = [];
    for (const sh of sheets){
      const det = detectHeader(sh.rows, 'materiais'); if (!det || det.mapping.codigo==null || det.mapping.nome==null) continue;
      const m = det.mapping; const vcol = m.valorUnitario!=null ? m.valorUnitario : m.valorTotal;
      const itens = [];
      for (let i=det.row+1;i<sh.rows.length;i++){ const r = sh.rows[i]||[]; const cod = String(r[m.codigo]==null?'':r[m.codigo]).trim(); const desc = String(r[m.nome]==null?'':r[m.nome]).replace(/\s+/g,' ').trim();
        if (!cod || !desc || TOTAL_LINE.test(norm(desc))) continue;
        const v = vcol!=null ? parseBR(r[vcol]) : null;
        itens.push({codigo:cod, descricao:desc, unidade: m.unidade!=null ? (normalizeUnit(r[m.unidade])||'Unidade') : (/^cabo /i.test(desc)?'Metro':'Unidade'), valor: v==null?0:Math.max(0,v), tabela: sh.name, fonte: file.name}); }
      if (itens.length) res.push({tabela:sh.name, itens});
    }
    if (!res.length) return toast('Nenhuma aba com colunas de código e descrição foi reconhecida.','err',6000);
    const ok = await confirmDialog({title:'Importar catálogo', message:`<b>${esc(file.name)}</b><br><br>${res.map(r=>`Aba <b>${esc(r.tabela)}</b>: ${r.itens.length} item(ns)`).join('<br>')}<br><br><label><input type="checkbox" id="catReplace" checked> Substituir os itens existentes das tabelas com o mesmo nome</label>`, okText:'Importar'});
    if (!ok) return;
    const replace = !!(confirmDialog.checks||{}).catReplace;
    let cat = catalogo();
    if (replace){ const tabs = new Set(res.map(r=>r.tabela)); cat = cat.filter(x=>!tabs.has(x.tabela)); }
    let n=0; res.forEach(r=>r.itens.forEach(it=>{ const ex = cat.find(x=>x.tabela===it.tabela && String(x.codigo)===String(it.codigo)); if (ex) Object.assign(ex, it); else cat.push(it); n++; }));
    db.catalogo = cat; db.catalogoAtualizadoEm = new Date().toISOString(); saveDB(); go('catalogo'); toast(`${n} item(ns) importado(s) para o catálogo.`,'ok',5000);
  } catch(err){ toast('Erro ao importar o catálogo: '+err.message,'err',7000); }
}
